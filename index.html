// ---------- 网页版：添加到主屏幕 ----------
// 只有网页版（dist/web，带 manifest）才提示安装；Claude 里的在线版和双击打开的单文件不提示。
const isWebBuild = !!document.querySelector('link[rel=manifest]');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
let installPrompt = null;   // 安卓 / 电脑上的 Chrome：浏览器给的「安装」弹窗
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; if (menu && menu.screen === 'title') menu.render(); });
addEventListener('appinstalled', () => { installPrompt = null; if (menu && menu.isOpen) menu.render(); });
// 'prompt' = 可以直接弹出安装；'manual' = 手机上，要按步骤手动添加；null = 不需要提示
function installState() {
  if (!isWebBuild || isStandalone()) return null;
  if (installPrompt) return 'prompt';
  return touch.enabled || isIOS ? 'manual' : null;
}
const touch = new TouchControls(UI);

function handleUIKeys() {
  // 菜单打开时：方向键 / 十字键选择，Enter / A 确认，Esc / B / Start 返回
  if (menu.isOpen) {
    if (Input.wasPressed('Escape') || Input.padWasPressed(1) || Input.padWasPressed(9) || (Input.wasPressed('KeyP') && state === 'pause')) menu.back();
    if (Input.wasPressed('ArrowDown') || Input.wasPressed('Tab') || Input.padWasPressed(13)) menu.nav(1);
    if (Input.wasPressed('ArrowUp') || Input.padWasPressed(12)) menu.nav(-1);
    if (Input.padWasPressed(0)) menu.activate();
    return;
  }
  if (Input.wasPressed('KeyE') || Input.padWasPressed(3)) UI.panel();
  if (Input.wasPressed('KeyM') || Input.padWasPressed(8)) UI.map();
  if (Input.wasPressed('Escape')) {
    if (empirePanel.isOpen) empirePanel.close();
    else if (defensePanel.isOpen) defensePanel.close();
    else if (map.open) UI.map();
    else if (colonyPanel.isOpen) colonyPanel.close();
    else if (panel.isOpen) panel.toggle();
    else UI.pause();
  }
  if (Input.wasPressed('KeyP') || Input.padWasPressed(9)) UI.pause();
  if (Input.wasPressed('F1') || Input.wasPressed('Backquote')) UI.tuning();
  if (Input.wasPressed('KeyH')) { S.help = !S.help; saveSettings(); applySettings(); hud.hintTimer = 0; }
  if (Input.wasPressed('KeyO')) UI.mute();
  if (Input.wasPressed('Equal') || Input.wasPressed('NumpadAdd')) cam.zoomBy(0.7);
  if (Input.wasPressed('Minus') || Input.wasPressed('NumpadSubtract')) cam.zoomBy(1.4);
}
// 滚轮：随时缩放；拉到足够远就渐变成星图（在面板上滚动时不缩放）
addEventListener('wheel', (e) => {
  if (e.target !== canvas && e.target !== document.body) return;
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  cam.zoomBy(Math.exp(clamp(d, -120, 120) * 0.002));
}, { passive: false });

// 星图模式下拖动平移（鼠标左键 / 单指）；双指捏合缩放（任何时候）
const drag = { id: null, x: 0, y: 0 };
const pinch = new Map();
let pinchD = 0;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') {
    pinch.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch.size === 2) { const [a, b] = [...pinch.values()]; pinchD = Math.hypot(a[0] - b[0], a[1] - b[1]); drag.id = null; pinched = true; return; }
  } else if (e.button !== 0) return;
  if (map.open && pinch.size < 2) { drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', (e) => {
  if (pinch.has(e.pointerId)) {
    pinch.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch.size === 2) {
      const [a, b] = [...pinch.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinchD > 0 && d > 0) cam.zoomBy(pinchD / d);
      pinchD = d;
      return;
    }
  }
  if (e.pointerId !== drag.id) return;
  cam.panX -= (e.clientX - drag.x) / cam.scale;
  cam.panY -= (e.clientY - drag.y) / cam.scale;
  drag.x = e.clientX; drag.y = e.clientY;
});
const dragEnd = (e) => {
  pinch.delete(e.pointerId); if (pinch.size < 2) pinchD = 0;
  if (e.pointerId === drag.id) drag.id = null;
  // 没怎么移动的单击（< 8 像素、< 500 毫秒）= 点星空：星图里点星球；v0.11.4 起不在星图时也算，用来关殖民地面板
  if (tapStart && tapStart.id === e.pointerId) {
    if (!pinched && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 8 && e.timeStamp - tapStart.t < 500) canvasTap(e.clientX, e.clientY);
    tapStart = null;
  }
  if (!pinch.size) pinched = false;
};
let tapStart = null, pinched = false;   // pinched：这次触摸里出现过双指，松手不算点击
canvas.addEventListener('pointerdown', (e) => { tapStart = (map.open || colonyPanel.isOpen) && pinch.size < 2 && (e.pointerType === 'touch' || e.button === 0) ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp } : null; });   // 用事件自己的时间戳：主线程忙时不会把快点误判成长按
// v0.11.4：点星空。星图里交给 mapTap；不在星图时，殖民地面板开着就关掉（点右上角「随行精灵」不算星空）
function canvasTap(x, y) {
  if (map.open) { mapTap(x, y); return; }
  if (!colonyPanel.isOpen || state !== 'play') return;
  const r = hud.sqRect;
  if (r && x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]) return;
  colonyPanel.close();
}
// 星图模式下鼠标移到殖民地上时变成手形
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const hit = map.open && drag.id == null ? map.pick(e.clientX, e.clientY, cam, world, eco) : null;
  canvas.style.cursor = (hit && hit.colony) || (map.open && (map.hitGarrison(e.clientX, e.clientY) || map.hitButton(e.clientX, e.clientY) || map.hitDefense(e.clientX, e.clientY))) ? 'pointer' : map.open ? 'grab' : '';
});

// 在星图上点星球：殖民地 → 打开远程管理；其他星球 → 显示一句介绍
function mapTap(x, y) {
  if (!map.open) return;
  if (map.hitDefense(x, y)) { empirePanel.close(); defensePanel.isOpen ? defensePanel.close() : defensePanel.open(); return; }
  if (map.hitEmpire(x, y)) { defensePanel.close(); empirePanel.toggle(); return; }   // v0.12
  // v0.10：「丰度」开关
  if (map.hitButton(x, y)) { S.richMap = !S.richMap; saveSettings(); audio.node && audio.node(); return; }
  const badge = map.hitGarrison(x, y);
  if (badge) {
    if (defensePanel.isOpen) defensePanel.mapPick(badge);
    else if (eco.trade.underAttack(eco.colonies.get(badge)) || !eco.transfers.available(eco.colonies.get(badge)).length) defensePanel.open(badge);
    else defensePanel.openSource(badge);
    return;
  }
  const hit = map.pick(x, y, cam, world, eco);
  // v0.11.4：防务菜单开着时，点击只用来选来源和目标，不关面板；否则点空白处 / 非殖民星就关掉殖民地面板
  const closePanel = () => { if (!defensePanel.isOpen && colonyPanel.isOpen) colonyPanel.close(); };
  if (!hit) { closePanel(); return; }
  const p = hit.planet, c = hit.colony;
  if (c && c.fallen) { closePanel(); hud.flash(`${p.name} 已失守：飞过去清掉收割者、重新唤醒才能收复`); return; }
  if (c) {
    if (defensePanel.isOpen) { defensePanel.mapPick(c.pid); return; }
    const here = player.ground && player.ground.base === p;
    colonyPanel.open(p, !here);
    audio.node && audio.node();
    return;
  }
  closePanel();
  const harv = p.st.harv.filter((h) => h.alive).length;
  const rich = p.st.scanned && p.survey ? ` · ${richLabel(p, p.survey.rich)}${p.survey.find ? ` · ${FINDS[p.survey.find].zh}` : ''}` : ' · 未扫描';
  const desc = `${p.name} · ${p.typeZh}${rich} · ${p.st.bloom ? (harv ? `已苏醒，还有 ${harv} 只收割者` : '已苏醒，可以殖民') : '枯萎'}${p.st.bloom && !harv ? '（要飞过去建立前哨站）' : ''}`;
  // v0.12：自动开拓解锁后，点没有殖民地的星可以标为「不开拓」/ 取消
  if (eco.industryUnlocked && !eco.colonyOf(p)) {
    const marked = eco.pioneers.noCol.has(p.id);
    cards.now(p.name.split(' ')[0], desc + (marked ? ' · 已标为不开拓' : ''), 'scan', 6, { label: marked ? '取消「不开拓」' : '标为不开拓', fn: () => hud.flash(eco.pioneers.markNo(p, !marked).msg) });
  } else hud.flash(desc);
}
canvas.addEventListener('pointerup', dragEnd);
canvas.addEventListener('pointercancel', dragEnd);
addEventListener('keydown', () => audio.start());
addEventListener('pointerdown', (e) => { audio.start(); if (e.target === canvas) canvas.focus(); });

// 触屏摇杆 → 飞船输入。摇杆的意思是「往这个方向飞」：
//   太空中    飞船自动转向摇杆方向，机头大致对准后才推进，推得越远推力越大
//   引力场内  摇杆朝外 = 向外推（W），朝星球 = 向内推（S），左右 = 横移
//   着陆后    左右 = 贴地滑行，明显朝外推 = 升空
let touchUp = null;   // 着陆时按下摇杆那一刻的「朝外」方向
function applyTouch(inp) {
  const j = touch.vec();
  if (j.m <= 0 || !player.ground) touchUp = null;
  if (j.m <= 0) return;
  // 屏幕方向 → 世界方向（镜头可能旋转）
  const c = Math.cos(-cam.rot), s = Math.sin(-cam.rot);
  const dx = j.x * c - j.y * s, dy = j.x * s + j.y * c;
  const m = j.m;
  const b = player.ground || player.fieldBody;
  if (b) {
    const ux = player.x - b.x, uy = player.y - b.y, d = Math.hypot(ux, uy) || 1;
    let nx = ux / d, ny = uy / d;
    // 着陆后按住摇杆时锁定参考方向：一直往右推就一直沿星球滑下去（和按住 D 一样），
    // 不会因为滑到星球侧面、「右」变成了「朝外」而意外起飞
    if (player.ground) {
      if (!touchUp) touchUp = [nx, ny];
      [nx, ny] = touchUp;
    }
    const r = (dx * nx + dy * ny) * m;       // 朝外的分量
    const t = (-dx * ny + dy * nx) * m;      // 切向分量（正 = 与 A/D 的 D 同向）
    inp.turn = Math.abs(t) < 0.12 ? 0 : clamp(t * 1.5, -1, 1);
    if (player.ground) {
      inp.thrust = r > 0.55 && r > Math.abs(t) * 1.4;   // 明显朝外推才起飞
    } else {
      inp.thrust = r > 0.18;
      inp.thrustAmt = clamp((r - 0.08) / 0.4, 0, 1);
      inp.reverse = r < -0.35;
    }
  } else {
    const diff = wrapAngle(Math.atan2(dy, dx) - player.angle);
    inp.turn = clamp(diff / 0.8, -1, 1);
    const face = clamp((Math.cos(diff) - 0.55) / 0.45, 0, 1);
    inp.thrustAmt = m * face;
    inp.thrust = inp.thrustAmt > 0.04;
  }
}

// ---------- 渲染 ----------
const visible = [];
const NO_STAR_LIGHT = [-0.6, -0.8, 0];
const SHADOW = [0.06, 0.07, 0.2];   // 扁平阴影统一偏冷的深蓝

function planetLight(b) {
  if (!b.light) return NO_STAR_LIGHT;
  const st = world.nearest(b.light, b.x, b.y);
  const dx = st.x - b.x, dy = st.y - b.y;
  const d = Math.hypot(dx, dy) || 1;
  return [dx / d, dy / d, 0];
}

function disc(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

// 扁平恒星：阶梯式光晕 + 缓慢转动的光芒 + 实色日面
function drawStarFlat(b) {
  const R = b.R;
  const pulse = 1 + Math.sin(time * 1.3 + R) * 0.02;
  for (const [k, a] of [[2.7, 0.05], [2.0, 0.08], [1.55, 0.13], [1.22, 0.24]]) {
    ctx.fillStyle = rgbToCss(b.edge, a);
    disc(b.x, b.y, R * k * pulse);
  }
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(time * 0.05);
  ctx.fillStyle = rgbToCss(b.edge, 0.16);
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2;
    const len = R * (1.75 + 0.25 * Math.sin(i * 2.3 + time * 0.8));
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0 - 0.08) * R, Math.sin(a0 - 0.08) * R);
    ctx.lineTo(Math.cos(a0) * len, Math.sin(a0) * len);
    ctx.lineTo(Math.cos(a0 + 0.08) * R, Math.sin(a0 + 0.08) * R);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = rgbToCss(b.edge);
  disc(b.x, b.y, R);
  ctx.fillStyle = rgbToCss(b.core);
  disc(b.x - R * 0.06, b.y - R * 0.06, R * 0.8);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  disc(b.x - R * 0.34, b.y - R * 0.34, R * 0.16);
}

// 扁平行星环：几条实色环带，后半圈压暗
function drawRings(b, front) {
  const R = b.R;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.ringAngle);
  ctx.scale(1, 0.22);
  const bands = [[1.42, 0.1, b.colors[1]], [1.6, 0.18, b.colors[3]], [1.84, 0.12, b.colors[1]], [2.02, 0.07, b.colors[4]]];
  for (const [r, w, c] of bands) {
    ctx.strokeStyle = rgbToCss(front ? c : mixRgb(c, SHADOW, 0.35), 0.9);
    ctx.lineWidth = R * w;
    ctx.beginPath();
    if (front) ctx.arc(0, 0, R * r, 0, Math.PI);
    else ctx.arc(0, 0, R * r, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// 没有 WebGL 时的简化扁平星球
function drawFallbackPlanet(b) {
  const L = planetLight(b);
  ctx.fillStyle = rgbToCss(mixRgb(b.colors[2], SHADOW, 0.45));
  disc(b.x, b.y, b.R);
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = rgbToCss(b.colors[2]);
  disc(b.x + L[0] * b.R * 0.62, b.y + L[1] * b.R * 0.62, b.R);
  ctx.restore();
}

let frameDt = 0.016;
const visC = [], visD = [];
function drawWorld() {
  const s = cam.scale;
  const pxPerUnit = s * dpr;
  const vr = cam.viewRadius + 400;
  const bodies = world.bodiesNear(cam.x, cam.y, vr, visible);
  const inView = (b, q) => {
    const [sx, sy] = cam.worldToScreen(b.x, b.y);
    const r = b.R * q * s;
    return sx + r > 0 && sx - r < cam.W && sy + r > 0 && sy - r < cam.H;
  };

  cam.apply(ctx, dpr);

  // 恒星
  for (const b of bodies) {
    if (b.kind === 'star' && inView(b, 2.8)) drawStarFlat(b);
  }

  // 行星 + 种子节点 + 收割者
  for (const b of bodies) {
    if (b.kind !== 'planet') continue;
    const q = 1.04 + 0.12 * Math.min(b.atmK, 1);
    const qq = b.ringed ? 2.2 : q + 0.3;
    if (!inView(b, qq)) continue;
    if (b.ringed) drawRings(b, false);
    if (glr.ok) glr.drawPlanet(ctx, b, pxPerUnit, time, planetLight(b), SHADOW, q);
    else drawFallbackPlanet(b);
    if (b.ringed) drawRings(b, true);
    garden.drawPlanetExtras(ctx, b, time);
    garden.drawHarvesters(ctx, b, player, time);
    const col = b.st.colony;
    if (col) drawColony(ctx, b, col, time);
  }
  garden.drawScan(ctx, time);   // v0.10：正在扫描的星球

  // 残骸（v0.9.6）
  for (const w of eco.wrecks) {
    const im = world.nearest(w, cam.x, cam.y);
    if (inView({ x: im.x, y: im.y, R: 20 }, 1)) garden.drawWreck(ctx, { id: w.id, x: im.x, y: im.y }, time);
  }

  // 能量结晶、掉落物
  for (const c of world.crystalsNear(cam.x, cam.y, vr, visC)) if (inView(c, 3)) garden.drawCrystal(ctx, c, time);
  for (const d of world.drops) {
    const im = world.nearest(d, cam.x, cam.y);
    if (inView(im, 3)) garden.drawCrystal(ctx, im, time);
  }

  if (T.showFields) {
    for (const b of bodies) if (b.kind === 'planet') drawFieldRing(ctx, b, player, s);
  }

  // 无人机
  for (const d of world.dronesNear(cam.x, cam.y, vr, visD)) if (inView(d, 3)) garden.drawDrone(ctx, d, player, time);
  garden.drawFreighters(ctx, world, eco, cam, time);

  garden.drawBeams(ctx, player, time, s);
  garden.drawFloaters(ctx, s);
  particles.draw(ctx, false);
  player.draw(ctx, time, fx, frameDt);
  sprites.draw(ctx, time, particles);
  particles.draw(ctx, true);
}

// ---------- 主循环 ----------
let last = performance.now();
let acc = 0;
let fps = 0, fpsAcc = 0, fpsN = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

  Input.poll();
  handleUIKeys();
  const playing = state === 'play';

  // 星图打开时游戏照常进行，飞船仍可操作；暂停 / 标题画面时整个世界停住
  if (playing) acc += dt; else acc = 0;
  let steps = 0;
  // 殖民地面板打开时不操作飞船（避免点按钮时误起飞）
  const ui = (colonyPanel.isOpen && !colonyPanel.remote) || !!tow;   // 远程管理时照样能飞；拖回途中不能操作
  const inp = player.input;
  inp.turn = ui ? 0 : Input.turn();
  inp.thrust = ui ? false : Input.thrust();
  inp.thrustAmt = 1;
  inp.reverse = ui ? false : Input.reverse();
  inp.boost = ui ? false : Input.boost();
  if (!ui && touch.enabled) {
    applyTouch(inp);
    if (touch.boost) inp.boost = true;
  }
  if (player.input.thrust || player.input.turn || player.input.reverse) cam.introHold = 0;
  cam.setWorld(world.W, world.H);
  player.fuelMax = eco.fuelMax;
  player.engineMul = eco.engineMul;
  player.drainMul = eco.drainMul;
  while (playing && acc >= STEP && steps < 10) {
    player.savePrev();
    if (!tow) player.step(STEP, world, fx);
    acc -= STEP;
    steps++;
  }
  if (steps >= 10) acc = 0;
  if (playing) {
    time += dt;
    // 飞船降落在哪个殖民地（随行精灵在这里回血）
    const gc = player.ground && player.ground.st ? player.ground.st.colony : null;
    eco.shipAt = gc ? gc.pid : null;
    // 有殖民地、还没有任何精灵巢、星尘够：偶尔提示一次
    nestTipT -= dt;
    if (nestTipT <= 0) {
      nestTipT = 360;
      if (!tutorial.listVisible && eco.colonies.size && eco.stardust >= 10 && ![...eco.colonies.values()].some((c) => c.nest)) hud.flash('建一座精灵巢来保护殖民地：精灵会驻守在那里，也可以带上它们去清理敌人');
    }
    updateTow(dt);
    updateCharge(dt);   // v0.11.4 按住充能
    hud.charging = charge.active;
    garden.update(dt, time, world, player, fx, sprites, hud, eco);
    handleGardenEvents();
    checkWrecks(dt);
    spawner.update(dt, world, player, eco);
    eco.tick(dt);
    colonyPanel.update(dt);
    defensePanel.update(dt);
    empirePanel.update(dt);
    map.commerce = empirePanel.commerce;   // v0.13 商业版图：星图上的航线加粗、按状态着色
    handleEcoEvents();
    {
      const cur = tutorial.current;
      const now = tutorial.update(dt, tview());
      if (cur && now.includes(cur)) audio.node && audio.node();
      tutorial.spotEnemies(world, cam, time);
    }
    checkVictory();
    checkDiscovery();
    cards.update(dt);
    player.interpolate(acc / STEP);
    cam.update(dt, time, player);
    particles.update(dt);
    hud.update(dt);
    audio.update(!player.ground && player.thrusting, player.boosting);
    audio.setLoops(!!garden.charging || charge.active, garden.drains.length > 0, garden.absorbing.length > 0);
  } else if (state === 'title') {
    // 标题画面：星球照常转动、镜头缓缓漂移，但世界不运行
    time += dt;
    titleDrift += dt;
    cam.panX = Math.sin(titleDrift * 0.05) * 600;
    cam.panY = Math.cos(titleDrift * 0.037) * 360;
    cam.update(dt, time, player);
  }

  // 背景
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const neb = nebulaColors(cam.x, cam.y, world.seed);
  if (glr.ok) glr.drawNebula(ctx, cam.W, cam.H, cam, neb, time);
  else { ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, cam.W, cam.H); }
  const sp = Math.hypot(player.vx, player.vy);
  const streak = clamp((sp - T.maxSpeed * 1.15) / (T.maxSpeed * 2), 0, 1) * 0.12;
  drawStarfield(ctx, cam, dpr, time, world.seed, [player.vx, player.vy], streak);

  frameDt = dt;
  // 星图混合度：镜头拉得越远越接近星图；完全是星图时不再画游戏画面
  const mapT = smoothstep(MAP_FROM, MAP_TO, cam.viewH);
  hud.mapT = mapT;
  if (mapT < 0.999) drawWorld();
  if (mapT < 0.6 && S.labels && state !== 'title') hud.drawColonyLabels(ctx, dpr, cam, world, eco);
  hud.touch = touch.enabled;
  hud.safe = safe;
  map.draw(ctx, dpr, cam, player, world, playing ? dt : 0, time, sprites, eco, mapT);
  if (state !== 'title' && mapT < 0.3) tutorial.drawLabels(ctx, dpr, cam, world, time, FONT);
  if (state !== 'title') hud.draw(ctx, dpr, cam, player, world, dt, S.fps ? fps : 0, { squad: sprites.list, cap: eco.squadCap, flash: sprites.flash, warn: state === 'play' && tutorial.squadWarn(tview()) }, mapT > 0.5 ? null : contextHint(), eco);
  drawTow();
  if (state !== 'title' && mapT < 0.3) tutorial.drawPointer(ctx, dpr, cam, player, world, time, tview(), (hud.topReserve || 96) * (hud.scale || 1) + safe.t, FONT);
  tutorial.on = S.tutorial;
  tutorial.touch = touch.enabled;
  {
    // 新手引导的位置：平时在左上角；殖民地面板打开时，放得下就挪到面板右边，放不下就收成一行进面板顶部
    let left = hud.tutLeft || 14, top = hud.tutTop || 100, inPanel = false;
    if (colonyPanel.isOpen && state === 'play' && tutorial.listVisible) {
      const r = colonyPanel.el.getBoundingClientRect();
      if (r.right + 12 + 280 + 8 <= innerWidth) { left = r.right + 12; top = r.top; }
      else inPanel = true;
    }
    // 引导进 / 出面板顶部时，面板马上重画一次（不等它自己的刷新计时）
    if (inPanel !== !!tutorial.inPanel) { tutorial.inPanel = inPanel; colonyPanel.render(); }
    tutorial.render({
      left, top, inPanel, cardTop: (hud.topReserve || 96) * (hud.scale || 1) + safe.t + 8,
      hide: state !== 'play' || menu.isOpen || (mapT > 0.5 && !(colonyPanel.isOpen && colonyPanel.remote)),
      hideCard: state !== 'play' || menu.isOpen || !!tow,   // 拖回的黑屏里不弹说明卡
    });
  }
  hud.tutBottom = tutorial.listBottom || 0;
  {
    // 结果卡：放在说明卡的位置；说明卡正在显示时放在它下面
    let top = (hud.topReserve || 96) * (hud.scale || 1) + safe.t + 8;
    const tc = tutorial.ui && tutorial.ui.card;
    if (tc && tc.style.display === 'block') top = Math.max(top, tc.getBoundingClientRect().bottom + 8);
    else if (tutorial.listBottom && innerWidth < 720) top = Math.max(top, tutorial.listBottom + 8);
    cards.render({ top, hide: state !== 'play' || menu.isOpen || !!tow });
  }
  map.touch = touch.enabled;
  {
    const cc = chargeColony();
    touch.sync(map.open, colonyPanel.isOpen && !colonyPanel.remote, hud.iconsTop, menu.isOpen, state === 'play' && !tow && !!cc && !cc.fallen && player.fuel < eco.fuelMax - 0.5);
  }
  if (state !== 'play' || cam.zoomTarget * cam.baseH < MAP_FROM) { defensePanel.close(); empirePanel.close(); }
  map.selected = colonyPanel.isOpen && colonyPanel.remote ? colonyPanel.planet.base : null;

  Input.endFrame();
  requestAnimationFrame(frame);
}

// ---------- 主菜单 ----------
let titleDrift = 0;
function startPlay() {
  if (state === 'title') { cam.introHold = 0; cam.panX = cam.panY = 0; }
  state = 'play';
  menu.close();
  audio.start();
  canvas.focus();
  if (newGame) { newGame = false; cam.introHold = 8; setTimeout(introToast, 500); }
  if (v10Notice) {
    v10Notice = false;
    const n = eco.migratedV9 && eco.migratedV9.miles;
    setTimeout(() => cards.push('v0.10「扫描与特产」', `唤醒不再给星尘，改成扫描和打无人机；城市以上的升级和高级飞船升级要特产（冰晶、熔核、氦）。靠近清掉收割者的星球会自动扫描${n ? `。已经达成的 ${n} 个隐藏里程碑补给了星尘` : ''}`, 'scan', 10), 1200);
  }
  if (spriteNotice) {
    const which = spriteNotice;
    spriteNotice = false;
    if (which === 'v7') setTimeout(() => hud.toast('精灵改版', '精灵现在由精灵巢孵化，驻守在殖民地。降落后在「搬运」页可以带上它们', '#9dffc8'), 600);
    else {
      const r = eco.migratedV8 && eco.migratedV8.refund;
      setTimeout(() => hud.toast('v0.9.5', `${r ? `精灵共鸣并入精灵巢，退回星尘 ${r}；` : ''}普通星球的精灵巢改成最多 1 / 2 / 3 只，气态巨行星上 5 / 8 / 12 只，你现有的精灵都保留`, '#9dffc8'), 600);
    }
  }
}
function canFullscreen() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
function applySettings() {
  audio.muted = S.muted;
  audio.setVolumes(S.master, S.sfx, S.amb);
  audio.setMuted(S.muted);
  hud.showHelp = S.help;
  hud.scale = S.uiScale;
  defensePanel.el.style.zoom = S.uiScale === 1 ? '' : String(S.uiScale);
  empirePanel.el.style.zoom = S.uiScale === 1 ? '' : String(S.uiScale);
  colonyPanel.el.style.zoom = S.uiScale === 1 ? '' : String(S.uiScale);
  panel.el.style.zoom = S.uiScale === 1 ? '' : String(S.uiScale);
  resize();
}
const menu = new Menu({
  isTouch: () => touch.enabled,
  isIOS: () => isIOS,
  installState,
  install: async () => {
    const p = installPrompt;
    if (!p) return;
    installPrompt = null;
    try { p.prompt(); await p.userChoice; } catch (e) { /* 用户取消 */ }
  },
  canFullscreen,
  fullscreen: () => UI.fullscreen(),
  latestSlot: () => latestSlot(),
  slot: () => slot,
  hasGame: () => state !== 'title',
  resume: () => { if (state === 'pause') startPlay(); },
  // 导出 / 导入（v0.11.4+）：正在玩的槽位先保存，导出的是这一刻的进度
  exportSlot: (n) => {
    if (n === slot) writeSave();
    const sv = readSlot(n);
    return sv ? encodeSave(sv, n) : Promise.reject(new Error('这个存档槽是空的'));
  },
  importTo: (n, save) => {
    if (state !== 'title' && n === slot) return false;   // 正在玩的槽位不能被覆盖（自动保存会马上写回去）
    const ok = writeSlot(n, save);
    if (ok && state === 'title' && n === slot) setupGame(readSlot(n));   // 标题画面背景就是这个槽：换成导入的
    return ok;
  },
  load: (n) => {
    // 标题画面背景里已经是这个存档了：直接进入
    if (state === 'title' && n === slot && world) { startPlay(); return; }
    writeSave();
    const sv = readSlot(n);
    if (!sv) { hud.flash('这个存档读不出来'); return; }
    setupGame(sv);
    slot = n; setCurrentSlot(n);
    startPlay();
    hud.flash(`已读取存档 ${n}`);
  },
  saveNow: () => writeSave(),
  saveTo: (n) => { slot = n; setCurrentSlot(n); return writeSave(); },
  del: (n) => { deleteSlot(n); if (n === slot && state === 'title') slot = null; },
  newGame: (n, seed) => {
    writeSave();
    setupGame(null, seed);
    slot = n; setCurrentSlot(n);
    state = 'play';
    writeSave();
    startPlay();
  },
  goHome: () => { rescue('menu'); startPlay(); },
  homeNote: () => (eco && eco.colonies.size && eco.shipLoaded() ? `货物会留在原地，${Math.round(WRECK.expire / 60)} 分钟内回去能捡回` : '飞船卡住或迷路时用'),
  quitToTitle: () => { writeSave(); state = 'title'; titleDrift = 0; cam.introHold = 1e9; colonyPanel.close(); if (panel.isOpen) panel.toggle(); audio.hush(); menu.open('title'); },
  fillTuning: (el) => panel.fill(el, true),
  milestones: () => (eco ? { done: MILESTONES.filter((m) => eco.milestones.has(m.id)).map((m) => ({ name: m.name, desc: m.desc, reward: m.reward, t: eco.milestones.get(m.id) })).sort((a, b) => a.t - b.t), total: MILESTONES.length } : null),
  restartTutorial: () => { S.tutorial = true; saveSettings(); tutorial.reset(); tutorial.check(tview(), true); writeSave(); },
  applySettings,
});

tutorial.mount({ onSkip: () => { hud.flash('已跳过新手引导：可以在「设置 · 画面和界面」里重新开始'); writeSave(); } });
// 点右上角的「随行精灵」：再看一次「敌人」说明卡
canvas.addEventListener('pointerdown', (e) => {
  const r = hud.sqRect;
  if (state !== 'play' || map.open || !S.tutorial || !r) return;
  if (e.clientX >= r[0] && e.clientX <= r[2] && e.clientY >= r[1] && e.clientY <= r[3]) tutorial.showTip('enemy', true);
});

// 开机：背景放上次玩的存档（没有就是一片新星域），显示标题画面
{
  const n = latestSlot();
  const sv = n ? readSlot(n) : null;
  setupGame(sv);
  slot = sv ? n : null;
  if (sv && currentSlot() !== n) setCurrentSlot(n);
}
applySettings();
cam.introHold = 1e9;   // 标题画面：镜头拉远到能看清周围（但还不到星图）
menu.open('title');
// 切到后台时自动暂停（手机来电、切换应用）
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { UI.pause(); } });

// 调试接口（测试脚本用）
window.__sg = { charge, empirePanel, fx, get time() { return time; }, touch, applyTouch, get spawner() { return spawner; }, mapTap, get player() { return player; }, get world() { return world; }, get eco() { return eco; }, get colonyPanel() { return colonyPanel; }, defensePanel, cam, T, hud, map, panel, particles, get garden() { return garden; }, sprites, rescue, get tow() { return tow; }, menu, S, UI, tutorial, get state() { return state; }, get slot() { return slot; }, writeSave, cards };

requestAnimationFrame(frame);

return {  };
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
