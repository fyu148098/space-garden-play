      case 'colup': r = eco.upgradeColony(c, this.shipHere); break;
      case 'load': r = eco.load(c, b.dataset.r, +b.dataset.v); break;
      case 'unload': r = eco.unload(c, b.dataset.r, +b.dataset.v); break;
      case 'pick': r = eco.pickColonists(c, +b.dataset.v); break;
      case 'sp-pick': if (this.shipHere) r = eco.pickSprites(c, +b.dataset.v); break;
      case 'sp-drop': if (this.shipHere) r = eco.dropSprites(c, +b.dataset.v); break;
      case 'drop': r = eco.dropColonists(c, +b.dataset.v); break;
      case 'charge': r = eco.charge(c, player, +b.dataset.v); break;
      case 'pod': r = eco.assemblePod(c, this.shipHere); break;
      case 'unpod': r = eco.unpackPod(c); break;
      case 'ship': r = eco.shipUpgrade(b.dataset.v, c, this.shipHere); break;
      case 'colonize': r = eco.colonize(this.planet); break;
      case 'rt-to': this.rtTo = b.dataset.v; break;
      case 'rt-res': this.rtRes = b.dataset.v; break;
      case 'rt-add': r = eco.addRoute(c, eco.colonies.get(this.rtTo), this.rtRes || 'food', 0.5); if (r.ok) this.rtTo = null; break;
      case 'rt-del': r = eco.removeRoute(+b.dataset.v); break;
      case 'rt-rsv': r = eco.cycleReserve(+b.dataset.v); break;
      case 'warp': r = eco.buildWarp(c, this.h.world.bloomedCount, this.shipHere); break;
      // v0.13 帝国管理 / 商业版图
      case 'lock': if (c) { c.locks.has(i) ? c.locks.delete(i) : c.locks.add(i); r = { ok: true, msg: c.locks.has(i) ? '锁住了这个建筑位：自动建造不会动它' : '解锁了这个建筑位' }; } break;
      case 'fo-open': this.focusOpen = !this.focusOpen; break;
      case 'fo-set': if (c) { c.focus = b.dataset.v; this.focusOpen = false; r = { ok: true, msg: `方针改为「${FOCUS[c.focus].name}」` }; } break;
      case 'ab': if (c) c.autoBuild = !c.autoBuild; break;
      case 'ag': if (c) c.autoUp = !c.autoUp; break;
      case 'rt-tgt': r = eco.trade.cycleTarget(+b.dataset.v); break;
      case 'rt-hold': { const rt = eco.trade.route(+b.dataset.v); if (rt) r = eco.trade.setHold(rt.id, !rt.hold); break; }
      case 'rt-edit': this.rtEdit = this.rtEdit === +b.dataset.v ? null : +b.dataset.v; break;
      case 'rt-set': r = eco.trade.setRes(+b.dataset.v, b.dataset.r); if (r.ok) this.rtEdit = null; break;
    }
    if (r && !r.msg && !r.ok) r = null;
    if (r && !r.ok && /才产/.test(r.msg) && this.h.onSpecialMiss) this.h.onSpecialMiss();   // v0.10：缺特产（说明卡）
    this.say(r);
    if (this.h.onChange) this.h.onChange(act, r);
    this.render();
  }

  render() {
    if (!this.isOpen || !this.planet) return;
    const { eco } = this.h;
    const p = this.planet.base;
    const c = eco.colonyOf(p);
    const bonus = TYPE_BONUS[p.type];
    // 新手引导（窄屏时收成一行放在面板最上面）
    let html = (this.h.tutBar && this.h.tutBar()) || '';
    html += `<div class="hd"><div class="t"><h2>${p.name}</h2>
      <div class="sub" style="color:#cfe0ff">${this.richLine(p)}</div>
      <div class="sub">${sizeClass(p.R)}星球 · 最高${LEVELS[maxLevelFor(p.R)].name}${c ? ` · ${LEVELS[c.level].name}（${c.level} 级）` : p.st.bloom ? ' · 尚未殖民' : ' · 枯萎'}${this.remote ? ' · <span style="color:#9fe8ff">远程管理</span>' : ''}</div>
      ${bonus ? `<span class="tag">${bonus.label}</span> <span class="tag" style="background:#26214a;color:#d8c8ff">适合：${bonus.role}</span>` : ''}</div>
      <div class="hdb">${c && !c.fallen ? this.chargeBtn() : ''}<button class="x" data-act="close">${this.remote ? '关闭' : 'E 关闭'}</button></div></div><div class="bd">`;
    html += c ? this.colonyHtml(c) : this.outpostHtml(p);
    html += '</div>';
    if (this.msg) html += `<div class="msg ${this.msg.ok ? 'ok' : 'err'}">${this.msg.msg}</div>`;
    const step = (this.h.tutStep && this.h.tutStep()) || 0;
    const key = html + '|' + step + '|' + this.tab + '|' + this.sel;
    if (key === this.lastHtml) return;   // 内容没变就不动 DOM
    this.lastHtml = key;
    const scroll = this.el.scrollTop;
    this.el.innerHTML = html;
    this.el.scrollTop = scroll;
    if (step && c) this.highlight(step);
  }

  // 「冰冻行星 · 冰晶 ★★★ · 产冰晶 · 埋藏物资」；没扫过的写「未扫描」（v0.10）
  richLine(p) {
    const sv = p.survey;
    if (!p.st.scanned || !sv) return `${p.typeZh} · 未扫描`;
    const sp = SPECIAL[p.type];
    return `${p.typeZh} · ${richLabel(p, sv.rich)}${sp ? ` · 产${RES_ZH[sp]}` : ''}${sv.find ? ` · ${FINDS[sv.find].zh}` : ''}`;
  }

  shipHtml() {
    const { eco, player } = this.h;
    const sp = SPECIAL_KEYS.filter((k) => eco.ship[k] >= 1).map((k) => ` · ${RES_ZH[k]} ${Math.floor(eco.ship[k])}`).join('');
    return `<div class="dim">飞船：能量 ${Math.round(player.fuel)}/${eco.fuelMax} · 货舱 ${Math.floor(eco.cargoUsed)}/${eco.cargoCap}（矿石 ${Math.floor(eco.ship.minerals)} · 食物 ${Math.floor(eco.ship.food)}${sp}）· 殖民者 ${eco.ship.colonists}/${eco.colonistCap} · 殖民舱 ${eco.ship.pod ? '有' : '无'} · 星尘 ${Math.floor(eco.stardust)}</div>`;
  }

  // 舱里装的东西
  podText(pod) { return `${pod.colonists} 名殖民者 · 食物 ${pod.food} · 能量 ${pod.energy} · 矿石 ${pod.minerals}`; }

  outpostHtml(p) {
    const { eco } = this.h;
    const top = maxLevelFor(p.R);
    const sizeTxt = `这颗星最高${LEVELS[top].name} · 最多 ${LEVELS[top].plots} 个建筑位`;
    if (!p.st.bloom) {
      return `<div class="card">这颗星球还是枯萎的。给表面所有种子充能，让它苏醒之后才能殖民。<div class="dim" style="margin-top:4px">${sizeTxt}</div></div>${this.shipHtml()}`;
    }
    const harv = p.st.harv.filter((h) => h.alive).length;
    const first = eco.colonies.size === 0;
    const pod = eco.ship.pod;
    const chk = eco.colonizeCheck(p);
    let h = `<div class="card"><div class="n">${first ? '建立第一个殖民地' : `建立新殖民地（第 ${eco.colonies.size + 1} 个）`}</div><div class="dim" style="margin-top:4px">${sizeTxt}</div>`;
    if (p.st.scanned && p.survey && p.survey.find) h += `<div class="dim" style="margin-top:4px;color:#ffd77a">这颗星下面有${FINDS[p.survey.find].zh}：殖民以后建一座采矿站就会开始挖</div>`;
    if (harv) h += `<ul class="req"><li class="no">✗ 先让精灵消灭星球上的 ${harv} 只收割者</li></ul>`;
    if (pod) {
      h += `<div class="dim" style="margin-top:6px">殖民舱里：${this.podText(pod)}，都会留在新殖民地。</div>
        <div class="row"><button class="a pri" data-act="colonize" ${chk.ok ? '' : 'disabled'}>建立殖民地</button></div>`;
    } else {
      const cost = eco.podCost();
      h += `<div class="dim" style="margin-top:6px">飞船上没有殖民舱。到任意殖民地的「搬运」页装配一个。下一个殖民舱需要：${cost.colonists} 名殖民者 · 食物 ${cost.food} · 能量 ${cost.energy} · 矿石 ${cost.minerals} · 星尘 ${cost.stardust}（你建立的第 ${eco.playerColonies + 1} 个殖民地；自动开拓的前哨不算）</div>`;
    }
    return h + `</div>${this.shipHtml()}`;
  }

  colonyHtml(c) {
    const { eco, player } = this.h;
    const cap = c.caps();
    const pc = c.popCap();
    const free = c.freePop();
    const bar = (v, m, col) => `<div class="bar"><i style="width:${Math.min(100, (v / m) * 100)}%;background:${col}"></i></div>`;
    if (c.fallen) return `<div class="card" style="border-color:#ff4a5e"><div class="n">殖民地已失守</div><div class="dim">${c.planet.st.harv.some((h) => h.alive) ? '星球重新枯萎，长出了收割者。用精灵清掉收割者、再给所有种子充能，就能收复。' : '星球重新枯萎。给所有种子重新充能，就能收复。'}建筑都还在，人口剩下 ${Math.floor(c.pop)}，库存需要重新运过来。</div></div>`;
    // v0.9.5：「每秒」显示含贸易的净值；有进出口时下面拆开写
    const net = c.net || c.rates, imp = c.imports || {}, exp = c.exports || {};
    const perSec = (g) => {
      const v = net[g];
      let t = `<span class="${v >= 0 ? 'pos' : 'neg'}">${sign(v)}/秒</span>`;
      const i = imp[g] || 0, o = exp[g] || 0;
      if (i > 0.005 || o > 0.005) t += `<br><small class="dim">本地 ${sign(c.rates[g])}${i > 0.005 ? ` · 进口 +${i.toFixed(2)}` : ''}${o > 0.005 ? ` · 出口 −${o.toFixed(2)}` : ''}</small>`;
      return t;
    };
    // v0.11.4：食物、能量的本地收支拆开：产出 · 居民 / 建筑 · 精灵（几项之和 = 本地收支）
    const U = c.upkeep || { posted: 0, owned: 0, foodNeed: 0, energy: 0, build: 0, fed: 1 };
    const split = (g) => {
      if (g === 'food' && U.posted > 0) return `<small class="dim split">产 +${r2(c.prodFood)} · 居民 −${r2(c.pop * POP_FOOD)} · 精灵 −${r2(U.foodNeed)}（驻 ${U.posted} 只）</small>`;
      if (g === 'energy' && U.owned > 0) {
        const drain = c.prodEnergy - U.build - U.energy - c.rates.energy;
        return `<small class="dim split">产 +${r2(c.prodEnergy)} · 建筑 −${r2(U.build)} · 精灵 −${r2(U.energy)}（本巢孵出 ${U.owned} 只）${drain > 0.005 ? ` · 被吸 −${r2(drain)}` : ''}</small>`;
      }
      return '';
    };
    // 特产（v0.10）：产得慢，按每分钟显示
    const perMin = (g) => {
      const v = (net[g] || 0) * 60;
      let t = `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}/分</span>`;
      const i = (imp[g] || 0) * 60, o = (exp[g] || 0) * 60;
      if (i > 0.05 || o > 0.05) t += `<br><small class="dim">本地 +${((c.rates[g] || 0) * 60).toFixed(1)}${i > 0.05 ? ` · 进口 +${i.toFixed(1)}` : ''}${o > 0.05 ? ` · 出口 −${o.toFixed(1)}` : ''}</small>`;
      return t;
    };
    let h = `<div class="res">
      <span>能量</span>${bar(c.stock.energy, cap.energy, '#ffb347')}<span class="num">${Math.floor(c.stock.energy)}/${cap.energy} ${perSec('energy')}</span>${split('energy')}
      <span>矿石</span>${bar(c.stock.minerals, cap.minerals, '#c9a27a')}<span class="num">${Math.floor(c.stock.minerals)}/${cap.minerals} ${perSec('minerals')}</span>
      <span>食物</span>${bar(c.stock.food, cap.food, '#9be06a')}<span class="num">${Math.floor(c.stock.food)}/${cap.food} ${perSec('food')}</span>${split('food')}
      ${SPECIAL_KEYS.filter((k) => c.special === k || c.stock[k] >= 1 || (imp[k] || 0) > 0.0005 || (exp[k] || 0) > 0.0005).map((k) => `<span>${RES_ZH[k]}</span>${bar(c.stock[k], cap[k], RES_COLOR[k])}<span class="num">${Math.floor(c.stock[k])}/${cap[k]} ${perMin(k)}</span>`).join('')}
      <span>人口</span>${bar(c.pop, pc, '#9dffc8')}<span class="num">${Math.floor(c.pop)}/${pc} <span class="dim">空闲 ${free}</span></span>
      <span>星尘</span><span class="dim">${c.rates.stardust > 0 ? `本殖民地 ${sign(c.rates.stardust)}/秒` : '全局资源'}</span><span class="num">${Math.floor(eco.stardust)}</span>
    </div>`;
    // 人口：满员移民 / 不增长的原因
    {
      const mig = eco.migRecent(c);
      const names = (arr) => [...new Set(arr.map((x) => x.planet.name.split(' ')[0]))].slice(0, 3).join('、');
      const lines = [];
      if (c.pop >= pc) lines.push(`人口已满：新增的人口会迁往 ${(eco.migRange(c) / 1000).toFixed(0)} 千以内没满的殖民地${mig.out.length ? `（最近迁往：${names(mig.out)}）` : ''}`);
      else if (c.starving) lines.push('人口不增长：缺粮');
      else if (c.stock.food <= 1) lines.push('人口不增长：食物库存为 0');
      else if (c.stock.energy <= 1) lines.push('人口不增长：能量库存为 0');
      if (mig.inn.length) lines.push(`最近 10 分钟有 ${mig.inn.length} 人从 ${names(mig.inn)} 迁入`);
      if (lines.length) h += `<div class="dim">${lines.join('<br>')}</div>`;
    }
    // 埋藏物资 / 古代遗迹（v0.10）：建一座采矿站来挖
    {
      const sv = c.survey;
      if (sv && sv.find) {
        const F = FINDS[sv.find];
        if (c.dug) h += `<div class="dim">${F.zh} · 已经挖出来了</div>`;
        else h += `<div class="card" style="border-color:#6a5a2a"><div class="n" style="color:#ffd77a">${F.zh}${c.mining ? `<span class="chip mid">挖掘中 ${mmss(c.dig)} / ${mmss(F.dig)}</span>` : ''}</div>
          <div class="dim">${c.mining ? (sv.find === 'cache' ? `挖完能拿到矿石 ${F.minerals} 和一些特产` : `挖完能拿到星尘 ${F.stardust}`) : `建一座采矿站来挖（${mmss(F.dig)}，挖的时候采矿站照常产出）${c.dig > 0 ? ` · 已经挖了 ${mmss(c.dig)}` : ''}`}</div></div>`;
      }
    }
    if (c.integrity < 100) h += `<div class="res"><span>防线</span>${bar(c.integrity, 100, '#ff6a7a')}<span class="num">${Math.round(c.integrity)}% <span class="dim">${c.raidT < 2 ? (c.stock.energy > 0.5 ? '能量被吸光后开始下降' : '正在下降') : '恢复中'}</span></span></div>`;
    if (c.starving) h += `<div class="card" style="border-color:#ffb347;color:#ffd08a">缺粮！建筑效率 ×0.7，人口不再增长，每 90 秒饿走 1 人。建农场、升级农场，或者从农业星球运粮。</div>`;
    else if (net.food < 0 && c.stock.food > 1 && c.stock.food < cap.food * 0.3) h += `<div class="dim" style="color:#ffd08a">粮食在减少，大约 ${Math.ceil(c.stock.food / -net.food / 60)} 分钟后吃光</div>`;
    // v0.11.4 精灵供粮不足 / 储能偏低
    {
      const warn = upkeepWarn(c);
      if (warn.fed) h += `<div class="dim" style="color:#ffd08a">${warn.fed}。驻在这里的 ${U.posted} 只精灵吃不饱，伤好得慢：多种粮、升级农场，或者从别处运粮</div>`;
      if (warn.low) h += `<div class="dim" style="color:#ffd08a">${warn.low}。这里的巢孵出的 ${U.owned} 只精灵每秒耗电 ${r2(U.energy)}（调到别处也算这里）：多建能量站，或者运能量过来</div>`;
    }
    if (c.raidT < 2) h += `<div class="card" style="border-color:#ff4a5e;color:#ff9aa8">正在遭到无人机袭击（${c.raidN || '?'} 架）！${c.garrisonN ? `驻守的 ${c.garrisonN} 只精灵正在迎战。` : '这里没有精灵驻守：'}带精灵过来支援，或者建精灵巢。</div>`;
    {
      const n = eco.transfers.counts(c);
      const extra = [n.temp ? `临时 ${n.temp}` : '', n.away ? `外派 ${n.away}` : '', n.inbound ? `在途 +${n.inbound}` : '', n.pending ? `待发 ${n.pending}${n.pendingRaid ? '（等通航）' : ''}` : ''].filter(Boolean).join(' · ');
      h += `<button class="a" data-act="defense">星图防务 · 驻守 ${n.stationed}${extra ? ` · ${extra}` : ''} · 可调 ${n.available}</button>`;
      const out = eco.sprites.filter((x) => x.tmp && x.post === c.pid).length;
      if (n.temp || out) h += `<button class="a" data-act="recall">召回临时支援${n.temp ? ` · 这里的 ${n.temp} 只回各自驻地` : ''}${out ? ` · 在别处的 ${out} 只回这里` : ''}</button>`;
    }
    h += this.industryHtml(c);   // v0.12 恒星工业区
    h += this.manageHtml(c);     // v0.13 帝国管理
    if (c.auto) { const b = eco.colonies.get(c.auto.base); h += `<div class="dim">自动开拓建立的前哨（来自 ${b ? b.planet.name.split(' ')[0] : '已失去的据点'}）</div>`; }
    h += `<div class="tabs"><button data-act="tab" data-v="colony" class="${this.tab === 'colony' ? 'on' : ''}">殖民地</button>
      <button data-act="tab" data-v="trade" class="${this.tab === 'trade' ? 'on' : ''}">贸易</button>
      <button data-act="tab" data-v="cargo" class="${this.tab === 'cargo' ? 'on' : ''}" ${this.remote ? 'disabled title="飞船要停在这里"' : ''}>搬运</button>
      <button data-act="tab" data-v="ship" class="${this.tab === 'ship' ? 'on' : ''}" ${this.remote ? 'disabled title="飞船要停在这里"' : ''}>飞船升级</button></div>`;
    if (this.remote) h += '<div class="dim">远程管理：可以建造、升级、分配工人和管理航线。搬运货物、接送殖民者、补能和升级飞船，需要飞船降落在这里。建造只用这里的库存。</div>';
    if (this.tab === 'colony') h += (this.remote ? this.spritesHtml(c, false) : '') + this.plotsHtml(c) + this.levelHtml(c) + this.warpHtml(c);
    else if (this.tab === 'cargo') h += this.cargoHtml(c);
    else if (this.tab === 'trade') h += this.tradeHtml(c);
    else h += this.shipUpHtml(c);
    return h;
  }

  // v0.12 恒星工业区状态卡：有资格的殖民地才显示
  industryHtml(c) {
    const { eco } = this.h;
    const star = eco.industryStar(c);
    if (!star) return '';
    const own = eco.industryOwner(star), done = eco.industryDoneAt(star);
    const sName = `${star.name.split(' ')[0]}（${star.typeZh}）`;
    if (own && own !== c) return `<div class="dim">附近的恒星 ${sName} 的工业区在 ${own.planet.name.split(' ')[0]}${done ? `（第 ${done.n} 套，已完成）` : ''}</div>`;
    if (!c.hasIndustry) {
      return `<div class="card" style="border-color:#5a4a2a"><div class="n" style="color:#ffd77a">恒星工业区 · ${sName}</div>
        <div class="dim">这里离恒星不到 ${INDUSTRY.range / 1000}k，可以建恒星工业区：恒星汲能站、信号放大站、冷却站，每座 ${BUILDINGS.siphon.levels[0].workers} 人，三座都满员、氦 / 熔核 / 冰晶都有，整套才运转。在空地上建造。</div></div>`;
    }
    const bs = c.industryPlots();
    const k = INDUSTRY.star[star.type] || INDUSTRY.star.yellow;
    const need = c.indNeed || { helium: INDUSTRY.use.helium * k[1], magma: INDUSTRY.use.magma, cryo: INDUSTRY.use.cryo * k[2] };
    const run = c.indRun;
    const chip = run ? '<span class="chip ok">运转中</span>' : `<span class="chip warn">停转</span>`;
    const mats = ['helium', 'magma', 'cryo'].map((g) => {
      const st = c.stock[g] || 0, per = need[g] * 60;
      const left = per > 0 ? st / per : 0;
      return `${RES_ZH[g]} ${Math.floor(st)}（−${per.toFixed(1)}/分${run ? ` · 约 ${left >= 1 ? Math.floor(left) + ' 分钟' : '不到 1 分钟'}` : ''}）`;
    }).join(' · ');
    const ppl = INDUSTRY_TYPES.map((t, i) => (bs[i] ? `${BUILDINGS[t].name} ${bs[i].workers}/${c.def(bs[i]).workers}` : `${BUILDINGS[t].name} 未建`)).join(' · ');
    let h = `<div class="card" style="border-color:${run ? '#ffb347' : '#5a4a2a'}"><div class="n" style="color:#ffd77a">恒星工业区 · ${sName}${chip}</div>
      <div class="cost">${ppl}</div><div class="cost">原料：${mats}</div>`;
    if (run) h += `<div class="cost">富余能量 <span class="pos">+${c.indSurplus.toFixed(2)}/秒</span> · 这颗星像大都市一样明亮</div>`;
    else if (c.indWhy) h += `<div class="cost neg">停转：${c.indWhy}</div>`;
    if (done) h += `<div class="dim">第 ${done.n} 套工业区 · 已完成</div>`;
    else if (run) h += `<div class="dim">连续运转 ${Math.floor(c.indT)}/${INDUSTRY.complete} 秒后完成这一套</div>`;
    h += `<div class="dim">冷却站附带储能 +${BUILDINGS.cooler.levels[0].cap.energy}。想关停：在工业建筑上按「−」撤下工人（标为手动，不会被补回）</div></div>`;
    return h;
  }

  // v0.13 帝国管理：方针、两个开关、下一步打算、自动升级的状态（第二套完成后才显示）
  manageHtml(c) {
    const { eco } = this.h;
    if (!eco.manageUnlocked || c.fallen) return '';
    const P = eco.planner, fk = P.focus(c), F = FOCUS[fk];
    let h = `<div class="card" style="border-color:#2f4d7a"><div class="n" style="color:#bcd4ff">帝国管理 · 方针「${F.name}」${c.focus ? '' : '<span class="dim">（默认）</span>'}
      <button class="a sm" data-act="fo-open" style="margin-left:auto">${this.focusOpen ? '收起' : '换方针'}</button></div>`;
    if (this.focusOpen) {
      const fit = FOCUS_FIT[c.type] || [];
      h += `<div class="blist">${FOCUS_KEYS.map((k) => `<button class="a ${k === fk ? 'pri' : ''}" data-act="fo-set" data-v="${k}"><b>${FOCUS[k].name}</b>${fit.includes(k) || FOCUS[k].types.includes(c.type) ? ' <span class="pos">适合</span>' : ''} <span class="cost">${focusDesc(k)}</span></button>`).join('')}</div>`;
    }
    if (fk === 'industry') { const why = P.industryWhy(c); if (why) h += `<div class="dim" style="color:#ffd08a">${why === 'far' ? '这里不在恒星 3000 以内，不建工业建筑，其余照方针建' : '这颗恒星的工业区在别的殖民地，不建工业建筑，其余照方针建'}</div>`; }
    h += `<div class="row"><button class="a ${c.autoBuild ? 'pri' : ''}" data-act="ab">自动建造：${c.autoBuild ? '开' : '关'}</button><button class="a ${c.autoUp ? 'pri' : ''}" data-act="ag">自动升级：${c.autoUp ? '开' : '关'}</button></div>`;
    h += `<div class="cost">${esc(planText(P.peek(c)))}</div><div class="cost">升级：${esc(upText(P.upBlock(c), c))}</div>`;
    if (c.locks.size) h += `<div class="dim">锁住的建筑位 ${c.locks.size} 个：自动建造不填、不升</div>`;
    return h + '</div>';
  }

  // v0.11.4：按过「−」的岗位不再自动补人
  manTag(on) { return on ? '<span class="man" title="手动：空闲的人不会自动补到这里。按「+」补到满员就恢复自动">手动</span>' : ''; }

  lockBtn(c, i) {
    if (!this.h.eco.manageUnlocked) return '';
    const on = c.locks.has(i);
    return `<button class="lk ${on ? 'on' : ''}" data-act="lock" data-i="${i}" title="锁住：自动建造不会在这里建造或升级">${on ? '已锁' : '锁'}</button>`;
  }

  plotsHtml(c) {
    const { eco } = this.h;
    const top = Math.min(c.maxLevel, 5);
    let h = `<div class="sec">建筑位 ${c.usedPlots}/${c.maxPlots}（这颗星最多 ${LEVELS[top].plots} 个 · 最高${LEVELS[top].name}）</div><div class="grid">`;
    // 核心
    h += `<div class="card"><div class="n"><span class="dot" style="background:#2fb4c8"></span>核心<span class="chip ${c.coreWorkers >= 2 ? 'ok' : 'warn'}">${c.coreWorkers >= 2 ? '运行' : '缺人'}</span></div>
      <div class="cost">基础产出 能量 ${LEVELS[c.level].prodE} · 矿石 ${LEVELS[c.level].prodM} · 食物 ${LEVELS[c.level].prodF}/秒${c.special ? ` · ${RES_ZH[c.special]} ${(SPECIAL_PROD.core * c.specialMul * 60).toFixed(1)}/分钟` : ''} · 居民吃 ${r1(c.pop * POP_FOOD)}/秒</div>
      <div class="cost">防御炮 · ${!eco.coreGun(c) ? '<span class="neg">核心没人，不开火</span>' : c.coreFire ? '<span class="pos">开火中</span>' : '待命'}</div>
      <div class="row">工人<button class="a sm" data-act="w-" data-i="0">−</button><span class="w">${c.coreWorkers}/2</span><button class="a sm" data-act="w+" data-i="0">+</button>${this.manTag(c.coreManual)}</div></div>`;
    for (let i = 1; i < c.plots.length; i++) {
      const b = c.plots[i];
      const sel = this.sel === i;
      if (b) {
        const d = c.def(b);
        const B = BUILDINGS[b.type];
        const st = b.status || '运行';
        const cls = !b.status ? 'ok' : b.status === '人手不足' ? 'mid' : 'warn';
        const upCost = eco.upgradeCost(c, i);
        const canUp = upCost && eco.canPay(c, upCost, this.shipHere);
        const miss = upCost && !canUp ? eco.missText(eco.missing(c, upCost, this.shipHere)) : '';
        h += `<div class="card ${sel ? 'sel' : ''}"><div class="n" data-act="sel" data-i="${i}" style="cursor:pointer"><span class="dot" style="background:${COLOR[b.type]}"></span>${B.name} ${b.level}级<span class="chip ${cls}">${st}</span>${this.lockBtn(c, i)}</div>
          <div class="cost">${this.effectText(c, b, d)}</div>
          ${b.status === '缺电' ? `<div class="cost neg">能量不够，已停工。建能量站让收支转正就会自动恢复，或者等储能攒到一半（${Math.round(c.caps().energy / 2)}）</div>` : ''}
          ${d.workers ? `<div class="row">工人<button class="a sm" data-act="w-" data-i="${i}">−</button><span class="w">${b.workers}/${d.workers}</span><button class="a sm" data-act="w+" data-i="${i}">+</button>${this.manTag(b.manual)}</div>` : ''}
          ${sel ? `<div class="row">${upCost ? `<button class="a pri" data-act="up" data-i="${i}" ${canUp ? '' : 'disabled'} title="${miss}">升级</button><span class="cost">${fmtCost(upCost)}</span>` : '<span class="dim">已满级</span>'}</div>
          <div class="row"><button class="a" data-act="toggle" data-i="${i}">${b.on ? '暂停' : '恢复'}</button><button class="a" data-act="demo" data-i="${i}">拆除（返还一半）</button></div>` : ''}
          </div>`;
      } else if (c.plotOpen(i)) {
        h += `<div class="card empty ${sel ? 'sel' : ''}" data-act="sel" data-i="${i}">＋ 空地 · 点击建造${this.lockBtn(c, i)}`;
        if (sel) {
          h += '<div class="blist">';
          for (const t of BUILD_ORDER) {
            if (BUILDINGS[t].industry && !eco.industryStar(c)) continue;   // v0.12：工业建筑只在恒星 3000 以内的殖民地出现
            const L1 = BUILDINGS[t].levels[0];
            const lock = eco.buildLock(c, t);
            const canB = !lock && eco.canPay(c, L1.cost, this.shipHere);
            const miss = lock || (canB ? '' : eco.missText(eco.missing(c, L1.cost, this.shipHere)));
            const cl = CLUSTER.types.includes(t) && c.plots.some((b) => b && b.type === t) ? ' <span class="pos">集群+</span>' : '';
            const nestTip = t !== 'nest' ? '' : c.type === 'gas' ? ` <span class="dim">能养 ${NEST_GAS.cap.slice(1).join(' / ')} 只，孵得更快</span>` : ` <span class="dim">这里最多养 ${BUILDINGS.nest.levels.map((x) => x.cap).join(' / ')} 只 · 气态巨行星上能养 ${NEST_GAS.cap.slice(1).join(' / ')} 只</span>`;
            h += `<button class="a" data-act="build" data-i="${i}" data-v="${t}" ${canB ? '' : 'disabled'} title="${BUILDINGS[t].desc}${miss ? '\n' + miss : ''}"><b>${BUILDINGS[t].name}</b>${cl} <span class="cost">${lock ? lock : fmtCost(L1.cost)}</span>${nestTip}</button>`;
          }
          h += '</div>';
        }
        h += '</div>';
      } else {
        const need = c.plotLevel(i);
        h += `<div class="card locked"><span class="dim">${need <= c.maxLevel ? `升到${LEVELS[need].name}解锁` : '这颗星球用不到'}</span></div>`;
      }
    }
    return h + '</div>';
  }

  effectText(c, b, d) {
    const B = BUILDINGS[b.type];
    if (B.industry) {   // v0.12 恒星工业区
      const need = c.indNeed && c.indNeed[B.industry];
      return `${B.desc}${need ? ` · ${RES_ZH[B.industry]} ${(need * 60).toFixed(1)}/分钟（整套运转时）` : ''} · ${d.workers} 人满员才工作`;
    }
    const tk = +c.typeMul(B.bonus).toFixed(2), cl = c.clusterMul(b.type);
    const k = tk * cl * (c.starving ? 0.7 : 1);
    const parts = [];
    if (tk !== 1) parts.push(`星球 ×${tk}`);
    if (cl > 1) parts.push(`集群 +${Math.round((cl - 1) * 100)}%`);
    if (c.starving && d.prod) parts.push('缺粮 ×0.7');
    const kTxt = parts.length ? `（${parts.join(' · ')}）` : '';
    if (d.prod && d.prod.food) return `食物 +${r1(d.prod.food * k)}/秒 · 耗电 ${d.use.energy}${kTxt}`;
    if (d.prod && d.prod.minerals) return `矿石 +${r1(d.prod.minerals * k)}/秒${c.special ? ` · ${RES_ZH[c.special]} +${(c.specialOf(b) * 60).toFixed(1)}/分钟` : ''} · 耗电 ${d.use.energy}${kTxt}`;
    if (d.prod && d.prod.energy) return `能量 +${r1(d.prod.energy * k)}/秒 · 上限 +${d.cap.energy}${kTxt}`;
    if (d.prod && d.prod.stardust) return `星尘 +${r1(d.prod.stardust * 60 * k)}/分钟 · 耗电 ${d.use.energy}${kTxt}`;
    if (d.popCap) return `人口上限 +${Math.round(d.popCap * tk)}${tk !== 1 ? `（星球 ×${tk}）` : ''}`;
    if (d.hatch) {
      // v0.9.5：精灵强度跟着巢的等级；普通星球上提一句气态巨行星
      const pw = NEST_POWER[b.level], pn = NEST_POWER[b.level + 1];
      const gas = c.type === 'gas';
      const own = (c.upkeep && c.upkeep.owned) || 0;
      return `孵化精灵：容量 ${d.cap} 只 · 每 ${d.hatch} 秒孵一只（能量 ${HATCH_COST.energy} · 星尘 ${HATCH_COST.stardust}）· 耗电 ${d.use.energy}<br>精灵耗电 ${own} × ${SPRITE_ENERGY} = ${r2(own * SPRITE_ENERGY)}/秒，暂停也照扣（这里孵出的精灵调到别处也算这里）<br>精灵强度 ×${pw.toFixed(2)}${pn ? `（升到 ${b.level + 1} 级后 ×${pn.toFixed(2)}）` : ''}${gas ? '' : `<br><span class="dim">气态巨行星上的巢能养 ${NEST_GAS.cap.slice(1).join(' / ')} 只</span>`}`;
    }
    // 仓库（精灵巢的 cap 是数字，前面已经处理了）
    if (d.cap) return `上限 矿石 +${Math.round(d.cap.minerals * tk)} · 能量 +${Math.round(d.cap.energy * tk)} · 食物 +${Math.round(d.cap.food * tk)} · 每种特产 +${Math.round(SPECIAL_CAP.storage[b.level] * tk)}${tk !== 1 ? `（星球 ×${tk}）` : ''}`;
    if (d.routes) return `${d.routes} 条航线 · 货船容量 ${d.cargo} ＋ 精灵 1 只 · 最远 ${(d.range * c.mul('port') / 1000).toFixed(1)}k · 耗电 ${d.use.energy}`;
    return '';
  }

  levelHtml(c) {
    const { eco } = this.h;
    const cost = eco.colonyUpgradeCost(c);
    if (!cost) return `<div class="card"><div class="n">${LEVELS[c.level].name}</div><div class="dim">${c.level >= 5 ? '已经是最高等级' : `已经是这颗星球能达到的最高等级（${sizeClass(c.planet.R)}星球最高${LEVELS[c.maxLevel].name}）`}</div></div>`;
    const N = LEVELS[c.level + 1], L = LEVELS[c.level];
    const can = eco.canPay(c, cost, this.shipHere);
    if (!can && eco.missSpecial(eco.missing(c, cost, this.shipHere)) && this.h.onSpecialMiss) this.h.onSpecialMiss();   // 第一次因为缺特产而升不了级：说明卡
    const plotsAfter = N.plots;
    return `<div class="card"><div class="n">升级为${N.name}</div>
      <div class="cost">建筑位 ${c.maxPlots} → ${plotsAfter} · 人口 +${N.pop - L.pop} · 存储上限 ${L.mCap}/${L.eCap} → ${N.mCap}/${N.eCap}${c.level + 1 === SHIPYARD_LEVEL ? ' · 解锁飞船升级和贸易站' : ''}</div>
      <div class="row"><button class="a pri" data-act="colup" ${can ? '' : 'disabled'}>升级</button><span class="cost">${fmtCost(cost)}</span>
      ${can ? '' : `<span class="neg">${eco.missText(eco.missing(c, cost, this.shipHere))}</span>`}</div></div>`;
  }

  warpHtml(c) {
    const { eco, world } = this.h;
    if (eco.won && c.warp) return `<div class="card"><div class="n">跃迁信标</div><div class="pos">已点亮。你找到了回家的路。</div></div>`;
    if (c.level < WARP.minLevel - 1) return '';
    const chk = eco.warpCheck(c, world.bloomedCount, this.shipHere);
    return `<div class="card"><div class="n">跃迁信标（终局目标）</div>
      <div class="cost">需要${LEVELS[WARP.minLevel].name}级殖民地 · 唤醒 ${WARP.minBloomed} 颗星球（现在 ${world.bloomedCount}） · ${fmtCost(WARP.cost)}</div>
      <div class="row"><button class="a pri" data-act="warp" ${chk.ok ? '' : 'disabled'}>点亮跃迁信标</button>${chk.ok ? '' : `<span class="neg">${chk.msg}</span>`}</div></div>`;
  }

  // 精灵卡片：驻守 / 随行 / 巢的孵化状态；canAct = 飞船降落在这里（远程时只能看）
  spritesHtml(c, canAct) {
    const { eco } = this.h;
    const gar = eco.garrison(c), sq = eco.squad();
    const temp = gar.filter((s) => s.tmp).length;
    const avg = (l) => (l.length ? Math.round((l.reduce((a, s) => a + s.hp, 0) / l.length / SPRITE.hp) * 100) : null);
    const hi = eco.hatchInfo(c);
    let nest;
    if (!hi) nest = '这里没有精灵巢：在空地上建一座，就会自动孵化精灵';
    else {
      const when = hi.next != null ? `下一只 ${Math.ceil(hi.next)} 秒后孵出（能量 ${HATCH_COST.energy} · 星尘 ${HATCH_COST.stardust}）` : hi.why === '已满' ? '已满，不再孵化' : `暂停孵化：${hi.why}`;
      nest = `巢 ${hi.nest.level} 级：容量 ${hi.owned}/${hi.cap}${hi.away ? `（在外 ${hi.away} 只）` : ''} · ${when}`;
    }
    const pw = (l) => (l.length ? (l.reduce((a, s) => a + eco.spritePow(s), 0) / l.length).toFixed(2) : null);
    const hp = [avg(gar) != null ? `驻守平均血量 ${avg(gar)}% · 强度 ×${pw(gar)}` : '', avg(sq) != null ? `随行平均血量 ${avg(sq)}% · 强度 ×${pw(sq)}` : ''].filter(Boolean).join(' · ');
    const dis = canAct ? '' : 'disabled';
    return `<div class="card"><div class="n">精灵<span class="cost" style="margin-left:auto">这里 ${gar.length} 只（驻守 ${gar.length - temp}${temp ? ` · 临时 ${temp}` : ''}）· 随行 ${sq.length}/${eco.squadCap}</span></div>
      <div class="dim">${nest}${hp ? `<br>${hp}` : ''}<br>驻守的精灵保护这里，在这里回血；临时支援来的不回血，战后飞回自己的驻地。随行的精灵跟着飞船去打敌人，飞船降落在殖民地时回血；放下的精灵长期驻守放下的地方。${canAct ? '' : '<br>远程只能看：带上和放下精灵要飞船降落在这里。'}</div>
      <div class="row"><button class="a" data-act="sp-pick" data-v="1" ${dis}>带上 1 只</button><button class="a" data-act="sp-pick" data-v="99" ${dis}>带满</button>
      <button class="a" data-act="sp-drop" data-v="1" ${dis}>放下 1 只</button><button class="a" data-act="sp-drop" data-v="99" ${dis}>全放</button></div></div>`;
  }

  cargoHtml(c) {
    const { eco } = this.h;
    const pod = eco.ship.pod;
    let h = this.shipHtml();
    // 殖民舱
    h += `<div class="card"><div class="n">殖民舱</div><div class="dim">殖民舱带走 ${POD.colonists} 名殖民者（空闲不够时从自动岗位撤人）和补给，在已苏醒的星球上建立新殖民地。殖民地越多，星尘越贵。</div>`;
    if (pod) {
      h += `<div class="dim" style="margin-top:6px">舱里：${this.podText(pod)}</div>
        <div class="row"><button class="a" data-act="unpod">拆下殖民舱</button><span class="cost">人和补给还给这里${pod.hull ? `，舱体返还一半，星尘 ${pod.stardust} 全额返还` : ''}</span></div>`;
    } else {
      const chk = eco.podCheck(c, this.shipHere);
      h += `<ul class="req">${chk.items.slice(2).map(([okk, t]) => `<li class="${okk ? 'ok' : 'no'}">${okk ? '✓' : '✗'} ${t}</li>`).join('')}</ul>
        <div class="row"><button class="a pri" data-act="pod" ${chk.ok ? '' : 'disabled'}>装配殖民舱</button></div>`;
    }
    h += '</div>';
    // 货物
    const goods = [['minerals', '矿石', '建造和升级时，这里的矿石不够会自动用飞船货舱里的补上'], ['food', '食物', '可以给缺粮的新殖民地送粮；装配殖民舱时也能用']];
    // v0.10 特产：飞船或这里有的时候才显示
    for (const k of SPECIAL_KEYS) if (eco.ship[k] >= 1 || c.stock[k] >= 1) goods.push([k, RES_ZH[k], `${SPECIAL_SRC[k]}才产。升级时这里不够会自动用货舱里的补上`]);
    for (const [k, name, tip] of goods) {
      h += `<div class="card"><div class="n">${name}<span class="cost" style="margin-left:auto">这里 ${Math.floor(c.stock[k])} · 货舱 ${Math.floor(eco.ship[k])}</span></div><div class="dim">${tip}</div>
        <div class="row"><button class="a" data-act="load" data-r="${k}" data-v="10">装 10</button><button class="a" data-act="load" data-r="${k}" data-v="99999">装满</button>
        <button class="a" data-act="unload" data-r="${k}" data-v="10">卸 10</button><button class="a" data-act="unload" data-r="${k}" data-v="99999">全卸</button></div></div>`;
    }
    h += this.spritesHtml(c, this.shipHere);
    h += `<div class="card"><div class="n">殖民者<span class="cost" style="margin-left:auto">空闲 ${Math.max(0, c.freePop())} · 可接 ${Math.max(0, Math.min(eco.spareColonists(c), Math.floor(c.pop) - CORE_WORKERS))} · 飞船 ${eco.ship.colonists}/${eco.colonistCap}</span></div><div class="dim">先接空闲的人；不够时从自动补上的岗位撤人（后补的先撤），不动标了「手动」的岗位和核心。殖民地至少留 ${CORE_WORKERS} 人</div>
        <div class="row"><button class="a" data-act="pick" data-v="1">接 1 人</button><button class="a" data-act="pick" data-v="999">接满</button>
        <button class="a" data-act="drop" data-v="1">放 1 人</button><button class="a" data-act="drop" data-v="999">全放</button></div></div>
      <div class="card"><div class="n">能量<span class="cost" style="margin-left:auto">殖民地 ${Math.floor(c.stock.energy)} · 飞船 ${Math.floor(this.h.player.fuel)}/${eco.fuelMax}</span></div>
        <div class="dim">按住 R 或「按住充能」：每秒从殖民地转 ${SHIP_CHARGE.rate} 到飞船，松开就停。殖民地能量可以被充到 0，充光了建筑可能缺电停工</div>
        <div class="row">${this.chargeBtn('chg wide')}<button class="a" data-act="charge" data-v="20">给殖民地输送 20</button><button class="a" data-act="charge" data-v="99999">全部输送（飞船留 20）</button></div></div>`;
    return h;
  }

  // 贸易：本地的贸易站、从这里出发的航线、运到这里的航线、开新航线
  // v0.13 商业版图：目标库存、暂停 / 继续、改货物（第二套完成后才有）
  routeOps(r) {
    const { eco } = this.h;
    if (!eco.manageUnlocked) return '';
    const T = eco.trade;
    let h = `<div class="row"><button class="a" data-act="rt-tgt" data-v="${r.id}">目标库存 ${r.target ? Math.round(r.target * 100) + '%' : '无'}</button>
      <button class="a ${r.hold ? 'pri' : ''}" data-act="rt-hold" data-v="${r.id}">${r.hold ? '继续' : '暂停'}</button>

// 更新读数时保留按钮／复选框节点，避免战斗刷新打断点击、焦点或触屏滚动。
function syncChildren(parent, next) {
  for (let i = 0; i < next.childNodes.length; i++) {
    const want = next.childNodes[i], old = parent.childNodes[i];
    if (!old) { parent.appendChild(want.cloneNode(true)); continue; }
    if (old.nodeType !== want.nodeType || old.nodeName !== want.nodeName) { old.replaceWith(want.cloneNode(true)); continue; }
    if (want.nodeType === 3) { if (old.textContent !== want.textContent) old.textContent = want.textContent; continue; }
    if (want.nodeType !== 1) continue;
    for (const a of [...old.attributes]) if (!want.hasAttribute(a.name)) old.removeAttribute(a.name);
    for (const a of [...want.attributes]) if (old.getAttribute(a.name) !== a.value) old.setAttribute(a.name, a.value);
    if (want.tagName === 'INPUT') old.checked = want.checked;
    syncChildren(old, want);
  }
  while (parent.childNodes.length > next.childNodes.length) parent.lastChild.remove();
}

const SLOT_COUNT = 3;

const SAVE_VERSION = 14;
const slotKey = (n) => `sg2.slot.${n}`;
const META_KEY = 'sg2.slots';
// v0.9.1 之前只有一个存档，第一次打开时搬到槽位 1
const LEGACY_KEYS = ['sg2.save.v6', 'sg2.save.v5', 'sg2.save.v4'];

function getMeta() {
  try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch (e) { return {}; }
}
function setMeta(m) {
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { /* ignore */ }
}

function currentSlot() { const c = getMeta().current; return c >= 1 && c <= SLOT_COUNT ? c : null; }
function setCurrentSlot(n) { const m = getMeta(); m.current = n; setMeta(m); }

function readSlot(n) {
  try { const raw = localStorage.getItem(slotKey(n)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

// 成功返回 true；存储空间满了等情况返回 false
function writeSlot(n, data) {
  try { localStorage.setItem(slotKey(n), JSON.stringify(data)); return true; } catch (e) { return false; }
}

function deleteSlot(n) {

function slotInfo(n) {

  if (!s) return { n, empty: true };
  return summarize(s, n);
}
// 一份存档的概要（槽位卡片和导入预览共用）
function summarize(s, n = 0) {
  const m = s.meta || {};
  const eco = s.eco || {};
  return {
    n, empty: false,
    savedAt: m.savedAt || 0,
    playTime: m.playTime != null ? m.playTime : eco.time || 0,
    colonies: m.colonies != null ? m.colonies : Object.keys(eco.cols || {}).length,
    pop: m.pop || 0,
    bloomed: m.bloomed || 0,
    seed: s.seed,

function listSlots() {
  const out = [];
  for (let n = 1; n <= SLOT_COUNT; n++) out.push(slotInfo(n));

  m.migrated = true;
  let moved = false;

      m.current = 1;
      moved = true;

const PRE_Z = 'SG2Z:';
const PRE_J = 'SG2J:';

function toB64(bytes) {

// 存档 → 存档码
async function encodeSave(save, slot = 0) {

  if (typeof CompressionStream === 'function') {

// 存档码 / 文件内容 / 存档 JSON → { ok, save, slot, at, msg }

    this.root = null;       // 从哪里进来的：'title' 或 'pause'
    this.tab = 'sound';
    this.confirm = null;    // 两步确认：再点一次才执行，例如 'del:2'
    this.newSlot = null;
    this.newSeed = 'default';
    this.customSeed = '';
    this.notice = null;     // 「已保存」之类的反馈，显示在页面说明的位置
    const st = document.createElement('style');
    st.textContent = CSS;
    document.head.appendChild(st);
    this.el = document.createElement('div');
    this.el.id = 'sg-menu';
    document.body.appendChild(this.el);
    this.el.addEventListener('click', (e) => this.onClick(e));
    this.el.addEventListener('input', (e) => this.onInput(e));
    this.el.addEventListener('change', (e) => this.onInput(e));
    // 自定义种子输入框里的按键不要传给游戏
    this.el.addEventListener('keydown', (e) => { if ((e.target.tagName === 'INPUT' && e.target.type === 'text') || e.target.tagName === 'TEXTAREA') e.stopPropagation(); });
  }

  get isOpen() { return this.el.classList.contains('open'); }

  open(root) {
    this.root = root;
    this.confirm = null;
    this.el.classList.add('open');
    this.show(root);
  }
  close() { this.el.classList.remove('open', 'title'); this.screen = null; this.root = null; }

  show(screen) {
    this.screen = screen;
    this.confirm = null;
    this.notice = null;
    this.el.classList.toggle('title', screen === 'title');
    this.render();
    // 打开新的一页时，焦点放在第一个按钮上（方便键盘 / 手柄）
    const first = this.el.querySelector('.mi, .slot .btn, .back');
    if (first && !this.h.isTouch()) first.focus({ preventScroll: true });
  }

  // Esc / 手柄 B
  back() {
    if (!this.isOpen) return;
    if (this.screen === 'pause') { this.h.resume(); return; }
    if (this.screen === 'title') return;
    if (this.screen === 'export' || this.screen === 'import') { this.show('slots'); return; }
    this.show(this.root);
  }

  // 键盘方向键 / 手柄十字键：在可聚焦的按钮间移动
  nav(dir) {
    const items = [...this.el.querySelectorAll('button:not([disabled]), input')].filter((x) => x.offsetParent);
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    const n = i < 0 ? 0 : (i + dir + items.length) % items.length;
    items[n].focus();
  }
  activate() {
    const a = document.activeElement;
    if (a && this.el.contains(a) && (a.tagName === 'BUTTON' || a.type === 'checkbox')) a.click();
  }

  // ---------- 渲染 ----------
  render() {
    const s = this.screen;
    let h = '';
    if (s === 'title') h = this.titleHtml();
    else if (s === 'pause') h = this.pauseHtml();
    else if (s === 'slots') h = this.slotsHtml();
    else if (s === 'new') h = this.newHtml();
    else if (s === 'settings') h = this.settingsHtml();
    else if (s === 'install') h = this.installHtml();
    else if (s === 'miles') h = this.milesHtml();
    else if (s === 'export') h = this.exportHtml();
    else if (s === 'import') h = this.importHtml();
    const ta = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act === 'impcode';
    this.el.innerHTML = h;
    if (ta) { const t = this.el.querySelector('[data-act=impcode]'); if (t) { t.focus({ preventScroll: true }); t.setSelectionRange(t.value.length, t.value.length); } }
    if (s === 'settings' && this.tab === 'feel') this.h.fillTuning(this.el.querySelector('.tune'));
  }

  backBtn(label) { return `<button class="back" data-act="back">‹ ${label || '返回'}</button>`; }

  titleHtml() {
    const slots = listSlots();
    const latest = this.h.latestSlot();
    const L = latest ? slots[latest - 1] : null;
    const any = slots.some((x) => !x.empty);
    return `<div class="box">
      <div class="logo"><b>SPACE GARDEN</b><span>小鱼的太空花园</span></div>
      <div class="items">
      ${L ? `<button class="mi primary" data-act="continue" data-n="${L.n}">继续游戏<small>存档 ${L.n} · ${esc(slotLine(L))} · ${fmtWhen(L.savedAt)}</small></button>` : ''}
      <button class="mi ${L ? '' : 'primary'}" data-act="go" data-to="new">新游戏<small>${L ? '选一个存档槽开始新的星域' : '从一片陌生的星域开始'}</small></button>
      <button class="mi" data-act="go" data-to="slots">读取存档<small>${any ? '读取、导出、导入、删除存档' : '还没有存档 · 可以导入别的设备上的存档'}</small></button>
      <button class="mi" data-act="go" data-to="settings">设置<small>声音 · 手感 · 画面和界面 · 操作说明</small></button>
      ${this.milesBtn()}
      ${this.installBtn()}
      </div>
      <div class="foot">${this.h.isTouch() ? '横屏体验更好' : '键盘 / 手柄 / 触屏 · 游戏中按 Esc 暂停'} · v${VERSION}</div>
    </div>`;
  }

  // v0.10 隐藏里程碑：只列出已经达成的；没达成的不显示内容
  milesBtn() {
    const m = this.h.milestones && this.h.milestones();
    if (!m) return '';
    return `<button class="mi" data-act="go" data-to="miles">里程碑<small>${m.done.length ? `已达成 ${m.done.length} 个 · 还有 ${m.total - m.done.length} 个没发现` : `还有 ${m.total} 个没发现`}</small></button>`;
  }

  milesHtml() {
    const m = this.h.milestones ? this.h.milestones() : { done: [], total: 0 };
    const left = m.total - m.done.length;
    const rows = m.done.map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.desc)}<br><small style="color:#8f9cc0">游戏时间 ${fmtPlay(x.t)}${x.reward ? ` · 星尘 +${x.reward}` : ''}</small></td></tr>`).join('');
    return `<div class="box wide">${this.backBtn()}
      <h2>里程碑</h2>
      <div class="lead">隐藏的里程碑：平时看不到，达成的时候才会出现</div>
      ${rows ? `<div class="card"><table>${rows}</table></div>` : '<div class="card" style="color:#8f9cc0;text-align:center">还没有达成任何里程碑</div>'}
      <div class="note" style="text-align:center;margin-top:12px">${left > 0 ? `还有 ${left} 个没发现` : '全部发现了！'}</div>
    </div>`;
  }

  // 网页版：还没装到主屏幕时，提示可以装（装好后全屏、有图标，像 app 一样）
  installBtn() {
    const st = this.h.installState();
    if (!st) return '';
    return `<button class="mi" data-act="install">${st === 'prompt' ? '安装到主屏幕' : '添加到主屏幕'}<small>像 app 一样从图标打开，全屏玩，断网也能玩</small></button>`;
  }

  installHtml() {
    const ios = this.h.isIOS();
    const steps = ios
      ? ['用 <b>Safari</b> 打开这个网址（在微信等 App 里打开的话，先点右上角「···」选「在 Safari 中打开」）',
        '点屏幕底部（iPad 是右上角）的<b>分享按钮</b>（方框加向上的箭头）',
        '往下滑，点<b>「添加到主屏幕」</b>，再点「添加」',
        '回到主屏幕，点 Space Garden 图标打开，就是全屏的了']
      : ['用 <b>Chrome</b> 或手机自带的浏览器打开这个网址（在微信等 App 里打开的话，先点右上角「···」选「在浏览器打开」）',
        '点浏览器的<b>菜单</b>（通常是右上角或底部的「⋮」或「≡」）',
        '选<b>「安装应用」</b>或<b>「添加到主屏幕」</b>',
        '回到主屏幕，点 Space Garden 图标打开，就是全屏的了'];
    return `<div class="box">${this.backBtn()}
      <h2>添加到主屏幕</h2>
      <div class="lead">装好后从图标打开：全屏、没有浏览器的地址栏，断网也能玩</div>
      <div class="card"><ol style="margin:0;padding-left:20px;line-height:1.7;font-size:14px;color:#dfe8ff">${steps.map((x) => `<li style="margin:6px 0">${x}</li>`).join('')}</ol></div>
      <div class="note" style="margin-top:12px">存档保存在各自的浏览器里：从主屏幕图标打开和在浏览器里打开是两份存档，换手机或换浏览器存档也不会自动跟过去。要搬存档，用「读取存档」里的「导出」和「导入存档」。</div>
    </div>`;
  }

  pauseHtml() {
    const n = this.h.slot();
    return `<div class="box">
      <h2>已暂停</h2>
      <div class="lead" ${this.notice ? 'style="color:#9dffc8"' : ''}>${this.notice || (n ? `存档 ${n} · 自动保存中` : '这一局还没有存档槽')}</div>
      <div class="items">
      <button class="mi primary" data-act="resume">继续游戏<small>${this.h.isTouch() ? '' : 'Esc'}</small></button>
      <button class="mi" data-act="save">保存<small>${n ? `立即保存到存档 ${n}（平时每隔几秒也会自动保存）` : '选一个存档槽保存'}</small></button>
      <button class="mi" data-act="go" data-to="slots">存档管理<small>读取、另存到别的槽、导出 / 导入、删除</small></button>
      <button class="mi" data-act="go" data-to="new">开始新存档<small>当前进度会先保存好</small></button>
      <button class="mi" data-act="go" data-to="settings">设置<small>声音 · 手感 · 画面和界面 · 操作说明</small></button>
      ${this.milesBtn()}
      <button class="mi" data-act="home">回到最近的殖民地<small>${this.h.homeNote ? this.h.homeNote() : '飞船卡住或迷路时用'}</small></button>
      <button class="mi" data-act="quit">回到标题画面<small>当前进度会先保存好</small></button>
      </div>
    </div>`;
  }

  slotCard(s, acts, extraCls = '') {
    const cur = this.h.slot() === s.n && this.h.hasGame();
    const tags = (cur ? '<span class="tag">当前</span>' : '') + (!s.empty && s.won ? '<span class="tag won">已点亮信标</span>' : '');
    const body = s.empty ? '<div class="empty">空</div>'
      : `<div class="info">${esc(seedLabel(s.seed))} · ${esc(slotLine(s))}</div>`;
    return `<div class="slot ${extraCls}" data-slot="${s.n}"><div class="hd">存档 ${s.n}${tags}<span class="when">${s.empty ? '' : fmtWhen(s.savedAt)}</span></div>${body}${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
  }

  slotsHtml() {
    const inGame = this.root === 'pause';
    const cur = this.h.slot();
    const cards = listSlots().map((s) => {
      const isCur = inGame && s.n === cur;
      let a = '';
      if (!s.empty && !isCur) a += `<button class="btn go" data-act="load" data-n="${s.n}">读取</button>`;
      if (inGame && !isCur) {
        a += this.confirm === `saveto:${s.n}`
          ? `<button class="btn warn" data-act="saveto" data-n="${s.n}">确定覆盖？</button>`
          : `<button class="btn" data-act="saveto" data-n="${s.n}">${s.empty ? '保存到这里' : '覆盖保存到这里'}</button>`;
      }
      if (isCur) a += `<button class="btn" data-act="save">立即保存</button>`;
      if (!s.empty) a += `<button class="btn" data-act="export" data-n="${s.n}">导出</button>`;
      if (!s.empty && !isCur) {
        a += this.confirm === `del:${s.n}`
          ? `<button class="btn warn" data-act="del" data-n="${s.n}">确定删除？删除后不能恢复</button>`
          : `<button class="btn" data-act="del" data-n="${s.n}">删除</button>`;
      }
      return this.slotCard(s, a);
    }).join('');
    return `<div class="box wide">${this.backBtn()}
      <h2>${inGame ? '存档管理' : '读取存档'}</h2>
      ${this.notice ? `<div class="lead" style="color:#9dffc8">${this.notice}</div>` : ''}
      <div class="lead">${inGame ? '读取别的存档前，当前进度会先保存好。「保存到这里」会把当前进度复制到那个槽位，之后自动保存到那里。' : `共 ${SLOT_COUNT} 个存档槽，正在玩的存档会自动保存`}</div>
      ${cards}
      <button class="mi" data-act="go" data-to="import">导入存档<small>把另一台设备上导出的存档码或文件放进一个存档槽</small></button></div>`;
  }

  // ---------- 导出 / 导入（在 iPhone 和电脑之间搬存档） ----------
  exportHtml() {
    const x = this.exp || {};
    const s = listSlots()[x.n - 1];
    const canShare = !!(x.file && navigator.canShare && navigator.canShare({ files: [x.file] }));
    let body;
    if (x.err) body = `<div class="lead bad">${esc(x.err)}</div>`;
    else if (!x.code) body = '<div class="lead">正在生成存档码…</div>';
    else {
      body = `<div class="acts">
          <button class="btn go" data-act="copycode">复制存档码</button>
          <button class="btn" data-act="sharefile">${canShare ? '分享文件（隔空投送 / 存到「文件」）' : '下载存档文件'}</button></div>
        <div class="note">存档码约 ${Math.max(1, Math.round(x.code.length / 1024))} KB。也可以长按下面的框全选复制：</div>
        <textarea readonly data-act="codebox">${esc(x.code)}</textarea>
        <div class="note">在另一台设备上：主菜单 →「读取存档」→「导入存档」，粘贴存档码或选择这个文件。导出的是现在这一刻的进度，之后在这边玩的不会跟过去。</div>`;
    }
    return `<div class="box wide">${this.backBtn()}
      <h2>导出存档 ${x.n}</h2>
      ${this.notice ? `<div class="lead ok">${esc(this.notice)}</div>` : ''}
      ${s && !s.empty ? this.slotCard(s, '') : ''}
      ${body}</div>`;
  }

  importHtml() {
    const x = this.imp || (this.imp = { text: '', res: null, slot: null, busy: false });
    const inGame = this.root === 'pause';
    const cur = inGame ? this.h.slot() : null;
    const slots = listSlots();
    if (x.slot == null || x.slot === cur) x.slot = (slots.find((s) => s.empty && s.n !== cur) || slots.find((s) => s.n !== cur)).n;
    const r = x.res;
    let preview = '';
    if (x.busy) preview = '<div class="note">正在读取…</div>';
    else if (r && r.ok) {
      const p = summarize(r.save);
      preview = `<div class="note ok">读到一份存档${r.slot ? `（原来是存档 ${r.slot}）` : ''}：${esc(seedLabel(p.seed))} · ${esc(slotLine(p))}${p.savedAt ? ` · 保存于 ${fmtWhen(p.savedAt)}` : ''}</div>`;
    } else if (r && r.msg) preview = `<div class="note bad">${esc(r.msg)}</div>`;
    const cards = slots.map((s) => (s.n === cur ? '' : this.slotCard(s, '', `pick ${s.n === x.slot ? 'sel' : ''}`))).join('');
    const target = slots[x.slot - 1];
    const ok = !!(r && r.ok);
    const label = !target.empty && this.confirm === `import:${x.slot}` ? `确定覆盖存档 ${x.slot}？原来的进度会丢掉` : `导入到存档 ${x.slot}${target.empty ? '' : '（覆盖）'}`;
    return `<div class="box wide">${this.backBtn()}
      <h2>导入存档</h2>
      ${this.notice ? `<div class="lead bad">${esc(this.notice)}</div>` : '<div class="lead">把另一台设备上「导出」得到的存档码粘贴到下面，或者选择导出的文件</div>'}
      <textarea data-act="impcode" placeholder="把存档码粘贴到这里（SG2Z:…）">${esc(x.text)}</textarea>
      <div class="acts"><button class="btn" data-act="pastecode">从剪贴板粘贴</button><span class="btn filebtn">选择存档文件<input type="file" accept=".txt,text/plain,.json,application/json" data-act="impfile"></span></div>
      ${preview}
      <div class="grp">放到哪个存档槽</div>
      ${cards}
      ${inGame && cur ? `<div class="note">正在玩的存档 ${cur} 不能被覆盖。想替换它，先回到标题画面再导入。</div>` : ''}
      <button class="mi primary" data-act="doimport" ${ok ? '' : 'disabled'}>${label}</button></div>`;
  }

  newHtml() {
    const slots = listSlots();
    if (this.newSlot == null || this.newSlot < 1 || this.newSlot > SLOT_COUNT) {
      const empty = slots.find((s) => s.empty);
      // 默认选第一个空槽；都满了就选最久没玩的那个
      this.newSlot = empty ? empty.n : slots.slice().sort((a, b) => a.savedAt - b.savedAt)[0].n;
    }
    const sel = slots[this.newSlot - 1];
    const inGame = this.root === 'pause';
    const curSel = inGame && sel.n === this.h.slot();
    const cards = slots.map((s) => this.slotCard(s, '', `pick ${s.n === this.newSlot ? 'sel' : ''}`)).join('');
    const over = !sel.empty;
    const confirming = this.confirm === 'new';
    const seedBtn = (v, l) => `<button class="btn ${this.newSeed === v ? 'on' : ''}" data-act="seed" data-v="${v}">${l}</button>`;
    return `<div class="box wide">${this.backBtn()}
      <h2>新游戏</h2>
      <div class="lead">选一个存档槽，之后会自动保存到这里</div>
      ${cards}
      <div class="grp">星域</div>
      <div class="seg">${seedBtn('default', '默认星域')}${seedBtn('random', '随机星域')}${seedBtn('custom', '输入种子')}</div>
      ${this.newSeed === 'custom' ? `<div class="seed"><input type="text" inputmode="numeric" placeholder="一串数字，例如 12345" value="${esc(this.customSeed)}" data-act="seedtext"></div>` : ''}
      <div class="note">出生星团（三颗新手星球）在每个星域都一样；种子决定其余星球的布局。${inGame && !curSel ? '当前进度会先保存好。' : ''}</div>
      <div style="margin-top:18px"><button class="mi ${over ? (confirming ? '' : '') : 'primary'}" data-act="start" style="${over ? `background:${confirming ? 'rgba(255,90,110,.28)' : 'rgba(255,90,110,.14)'};border-color:rgba(255,120,140,.55)` : ''}">
        ${over ? (confirming ? `确定覆盖存档 ${sel.n}？` : `覆盖存档 ${sel.n} 并开始`) : `在存档 ${sel.n} 开始`}
        <small>${over ? (confirming ? '再点一次开始；原来的进度会被删除，不能恢复' : `存档 ${sel.n} 里原来的进度会被删除`) : '飞船从太空出发，带着一个殖民舱'}</small></button></div>
    </div>`;
  }

  settingsHtml() {
    const tab = (k, l) => `<button class="btn ${this.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${l}</button>`;
    let body = '';
    if (this.tab === 'sound') {
      const v = (k, l) => `<div class="vrow"><span>${l}</span><input type="range" min="0" max="100" step="1" value="${Math.round(S[k] * 100)}" data-set="${k}"><b>${Math.round(S[k] * 100)}</b></div>`;
      body = `<div class="card">${v('master', '主音量')}${v('sfx', '音效')}${v('amb', '环境音')}
        <label class="chk"><input type="checkbox" data-set="muted" ${S.muted ? 'checked' : ''}><span>静音<small>游戏中按 O 也能切换</small></span></label></div>`;
    } else if (this.tab === 'feel') {
      body = '<div class="card"><div class="tune sg-tune"></div></div>';
    } else if (this.tab === 'ui') {
      const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="btn ${S[k] === v ? 'on' : ''}" data-act="opt" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
      const chk = (k, l, sub) => `<label class="chk"><input type="checkbox" data-set="${k}" ${S[k] ? 'checked' : ''}><span>${l}<small>${sub}</small></span></label>`;
      body = `<div class="card">
        <div class="opt"><span>界面大小</span>${seg('uiScale', [[0.85, '小'], [1, '标准'], [1.15, '大'], [1.3, '特大']])}</div>
        <div class="opt"><span>画质</span>${seg('quality', [['high', '高清'], ['low', '省电']])}</div>
        ${chk('help', '操作提示', '左下角的按键说明（游戏中按 H 也能切换）')}
        ${chk('tutorial', '新手引导', '左上角的目标清单、关键时刻的说明卡（所有存档）')}
        ${this.h.hasGame() ? `<div class="acts"><button class="btn" data-act="tutreset">${this.confirm === 'tutreset' ? '确定重新开始？' : '重新开始新手引导'}</button></div>` : ''}
        ${chk('hints', '情境提示', '屏幕下方告诉你下一步可以做什么')}
        ${chk('labels', '殖民地名牌', '殖民地上方的名字、等级、人口和警告')}
        ${chk('fps', '显示帧率', '右上角显示每秒帧数')}
        ${this.h.canFullscreen() ? '<div class="acts"><button class="btn" data-act="fullscreen">切换全屏</button></div>' : ''}
        <div class="acts"><button class="btn" data-act="resetui">${this.confirm === 'resetui' ? '确定恢复？' : '恢复默认（声音、画面和界面）'}</button></div></div>`;

const { hash } = __m_src_core_rng_js;
const { hexToRgb, mixRgb, smoothstep } = __m_src_core_math_js;

const CELL = 45000;
const PALETTES = [
  ['#3a1d6c', '#1b5f8a'],
  ['#6c1d4a', '#8a5a1b'],
  ['#1d6c5a', '#1b2f8a'],
  ['#4a1d7c', '#b33a7a'],
  ['#14467a', '#2f8a8a'],
  ['#5a2a1a', '#7a1b4a'],
  ['#1a3a6a', '#6a3ab0'],

  for (const [w, got] of eco.pickNear(mod(player.x, world.W), mod(player.y, world.H))) {
    if (got) {
      const a = [];
      for (const k of CARGO_KEYS) if (got[k]) a.push(`${RES_ZH[k]} ${got[k]}`);
      if (got.colonists) a.push(`殖民者 ${got.colonists}`);
      if (got.pod) a.push('殖民舱');
      hud.toast('残骸', `捡回了 ${a.join(' · ')}`, '#ffd23a');
      audio.node && audio.node();
      if (eco.wrecks.includes(w)) { hud.flash(`装不下了，残骸里还剩：${eco.wreckItems(w)}`); wreckFullT = 6; }
    } else if (!wreckFullT) {
      wreckFullT = 6;
      hud.flash(`货舱满了，捡不下残骸里的东西（${eco.wreckItems(w)}）：先卸货再来`);
    }
  }
}

function setupGame(save, seed = DEFAULT_SEED) {
  // 星域生成版本（v0.9.5）：旧存档没有 gen，按第 1 版生成，否则同一个种子会生成不一样的星域
  world = new World(save ? save.seed : seed, save ? save.gen || 1 : GEN_LATEST);

  particles.list.length = 0;
  Object.assign(cam, { zoom: 1, zoomTarget: 1, prevZoom: 1, panX: 0, panY: 0, introHold: 0, trauma: 0 });
  cam.baseH = cam.viewH = T.viewH;
  if (save) {
    const legacy = (save.v || 4) < 6;
    world.restore(save.world);
    // 旧存档里新手星球本来就是送的：标成 preBloomed，不多给精灵、不算「亲手唤醒」
    if (legacy) for (const p of world.starters) if (p.st.bloom) p.st.preBloomed = true;
    eco.restore(save.eco, world, legacy, save.v || 4);
    spriteNotice = eco.migratedV7 ? 'v7' : eco.migratedV8 ? 'v8' : false;
    v10Notice = (save.v || 4) < 9;
    markStartDiscovered();
    restorePlayer(save);
    // 新手引导：没有 tut 字段 = 旧存档，按完成条件补完；殖民地 ≥ 2 时默认跳过
    tutorial.restore(save.tut, tview());
    newGame = false;
  } else {
    eco.initStart();
    markStartDiscovered();
    goHome(true);
    tutorial.reset();
    newGame = true;
    spriteNotice = false;
    v10Notice = false;
  }
  cards.clear();
  // 无人机总数（v0.9.5）：新游戏和读旧存档时，活着的少于 DRONE_POP.total 就补满
  spawner.fillPopulation(world, eco);
  colonyPanel.close();
  victoryShown = eco.won;
  if (victoryEl) { victoryEl.remove(); victoryEl = null; }
  hud.toasts.length = 0; hud.msg = null; hud.hintTimer = 0;

// 「冰冻行星 · 冰晶 ★★★ · 产冰晶 · 埋藏物资」
function surveyText(p, sv) {
  const sp = SPECIAL[p.type];
  return `${p.typeZh} · ${richLabel(p, sv.rich)}${sp ? ` · 产${RES_ZH[sp]}` : ''}${sv.find ? ` · ${FINDS[sv.find].zh}` : ''}`;
}
function scanCard(ev) {
  cards.push(`扫描完成 · ${ev.p.name.split(' ')[0]}`, `${surveyText(ev.p, ev.sv)}${ev.dust ? ` · 星尘 +${ev.dust}` : ''}`, 'scan');
}
function digCard(ev) {
  const got = Object.entries(ev.got).filter(([, v]) => v > 0).map(([k, v]) => `${RES_ZH[k]} ${v}`).join(' · ');
  const lost = Object.entries(ev.lost || {}).map(([k, v]) => `${RES_ZH[k]} ${v}`).join('、');
  cards.push(`挖出了${FINDS[ev.find].zh}`, `${ev.c.planet.name.split(' ')[0]}：${got || '什么都没放下'}${lost ? `（仓库满了，丢掉了 ${lost}）` : ''}`, 'dig', 6);
  audio.bloom && audio.bloom();
}
function mileCard(m) {
  cards.push(`里程碑：${m.name}`, `${m.desc}${m.reward ? ` · 星尘 +${m.reward}` : ''}`, 'mile', 5.5);
  audio.node && audio.node();
}

// ---------- 胜利 ----------
let victoryShown = false;
let victoryEl = null;
// 经营事件：失守 / 收复
function handleEcoEvents() {
  for (const ev of eco.events) {
    if (ev.kind === 'transfer') { hud.flash(ev.msg); continue; }
    // v0.12 自动开拓
    if (ev.kind === 'pioneerLost' || ev.kind === 'pioneerBack' || ev.kind === 'outpost') { hud.flash(ev.msg); continue; }
    if (ev.kind === 'pioneerBloom') { const im = world.nearest(ev.p, cam.x, cam.y); if (Math.hypot(im.x - cam.x, im.y - cam.y) < cam.viewRadius + im.R) particles.burst(im.x, im.y, ['157,255,200', '255,224,138', '255,255,255'], 40, 220); continue; }
    // v0.12 恒星工业区：建齐三座时的「灯塔」提示、完成、信号（文案是提案）
    if (ev.kind === 'industryTip') { cards.push('恒星工业区', '一旦运转，这颗星会像星夜中的灯塔一样明亮——远处的目光，也会被它吸引。', 'defense', 10); continue; }
    if (ev.kind === 'industryDone') {
      const nm = ev.c.planet.name.split(' ')[0];
      if (ev.n === 1) cards.push('第一套恒星工业区完成', `${nm} 的工业区连续运转了 ${INDUSTRY.complete} 秒。帝国人口面板和自动开拓已经解锁：城市会自己向周边派出开拓者。打开星图，点右上角「星图调防」下面的「帝国」查看`, 'mile', 12);
      else cards.push(`第 ${ev.n} 套恒星工业区完成`, `${nm} 的工业区连续运转了 ${INDUSTRY.complete} 秒`, 'mile', 8);
      continue;
    }
    // v0.13：第二套完成 → 解锁帝国管理和商业版图 + 第二段信号（读档补发时 late = true）
    if (ev.kind === 'manageUnlock') {
      const nm = ev.c ? ev.c.planet.name.split(' ')[0] : '第二颗恒星';
      cards.push('第二套恒星工业区完成', `${ev.late ? '' : `${nm} 的工业区连续运转了 ${INDUSTRY.complete} 秒。`}帝国管理和商业版图已经解锁：每颗星会按方针自己建设，人满、资源富足时自己升级。打开星图「帝国」查看和调整，随时可以暂停。`, 'mile', 14);
      cards.push('信号能听懂了', '两座放大站对准同一片星空，那段节奏终于被拆开：是语言，人类的语言。字句残缺不全，只有一句反复出现，像是在呼唤——有人在吗？', 'mile', 16);
      continue;
    }
    if (ev.kind === 'autoUpgrade') { hud.flash(`${ev.c.planet.name.split(' ')[0]} 自动升级为${LEVELS[ev.level].name}`); continue; }
    if (ev.kind === 'signal') {
      if (ev.n === 1) cards.push('一段微弱的信号', '放大站对准星域深处时，捕捉到一段信号：微弱、断断续续，却一直在重复同一个节奏。像是有人在很远的地方，一遍又一遍地敲门。', 'mile', 14);
      else cards.push('信号又清晰了一些', '它还在重复同一个节奏，比上一次清楚了一点，像在等待回应。', 'mile', 10);
      continue;
    }
    // v0.11.3：援军晚到留下待命、驻地遇袭而精灵在别处临时支援——卡片上直接给「召回」
    if (ev.kind === 'lateArrival') {
      const c = ev.c;
      cards.push('援军晚到了', `${c.planet.name.split(' ')[0]} 的战斗已经结束，${ev.n} 只留在那里待命（不回血）。那里再遇袭会参战，战后返回 ${ev.post.split(' ')[0]}`, 'defense', 9,
        { label: '召回', fn: () => { const r = eco.transfers.recall(eco.colonies.get(c.pid)); hud.flash(r.msg); } });
      continue;
    }
    if (ev.kind === 'awayRaid') {
      const c = ev.c;
      cards.push(`${c.planet.name.split(' ')[0]} 遭到袭击`, `它的 ${ev.n} 只驻军正在别处临时支援，不会自动回防`, 'defense', 9,
        { label: '召回', fn: () => { const r = eco.transfers.recall(eco.colonies.get(c.pid)); hud.flash(r.msg); } });
      continue;
    }
    if (ev.kind === 'migrate') {
      // 目标星球在屏幕里时，飘一个「+1 移民」
      const im = world.nearest(ev.to.planet, cam.x, cam.y);
      if (Math.hypot(im.x - cam.x, im.y - cam.y) < cam.viewRadius + im.R) garden.floater(im.x, im.y - im.R - 30, '+1 移民', '#9dffc8');
      continue;
    }
    if (ev.kind === 'spriteDie') {
      // 精灵阵亡：随行的在它的位置炸开，驻守的在殖民地旁边
      let pos = sprites.posOf(ev.s.id);
      if (!pos) {
        const c = eco.colonies.get(ev.s.at);
        if (c) { const im = world.nearest(c.planet, cam.x, cam.y); pos = [im.x, im.y - im.R - 45]; }
      }
      if (pos && Math.hypot(pos[0] - cam.x, pos[1] - cam.y) < cam.viewRadius + 200) {
        particles.burst(pos[0], pos[1], ['255,255,255', '157,255,200', '255,224,138'], 24, 200);
        garden.floater(pos[0], pos[1] - 18, '精灵阵亡', '#ff9aa8');
        audio.bump && audio.bump();
      }
      continue;
    }
    if (ev.kind === 'wreckLost') {
      hud.toast('残骸', ev.w.colonists > 0 || ev.w.pod ? '残骸里的矿石和食物散失了（殖民者还在等你）' : '残骸里的货物散失了', '#ff9a5a');
      continue;
    }
    if (ev.kind === 'scan') { scanCard(ev); continue; }
    if (ev.kind === 'dig') { digCard(ev); continue; }
    if (ev.kind === 'milestone') { mileCard(ev.m); continue; }
    if (ev.kind === 'colonized') { tutorial.event(ev); continue; }
    if (ev.kind === 'hatch') {
      // 新手引导打开时用说明卡代替
      if (ev.first && !tutorial.event(ev)) hud.flash('第一只精灵孵化了！降落在殖民地时，可以在「搬运」页带上它');
      continue;
    }
    const name = ev.c.planet.name;
    if (ev.kind === 'raid') {
      tutorial.event(ev);
      hud.flash(`${name} 的灯光吸引来了 ${ev.n} 架无人机${ev.guarded ? '' : '（无人驻守）'}`);
      continue;
    }
    if (ev.kind === 'fall') tutorial.event(ev);
    if (ev.kind === 'fall') {
      hud.toast(name, ev.harv ? '殖民地失守了！星球重新枯萎，长出了收割者 · 进出这里的航线全部中断' : '殖民地失守了！星球重新枯萎 · 你已经没有精灵了，所以没长收割者：重新给种子充能就能收复', '#ff6a7a');
      hud.flash(ev.harv ? `${name} 失守：用精灵清掉收割者、重新给种子充能，就能收复（建筑都还在）` : `${name} 失守：给种子重新充能就能收复（建筑都还在）`);
      audio.boom && audio.boom(1);
    } else if (ev.kind === 'recapture') {
      hud.toast(name, '收复了殖民地！建筑都还在，人口和库存需要重新运过来', '#9dffc8');
    }
  }
  eco.events.length = 0;
}

// ---------- 存档 ----------
function snapshot() {
  const t = eco.totals();
  // 正在黑屏拖回、还没降落：按拖回完成后的样子存（读档时直接完成拖回）
  const pl = tow && !tow.landed
    ? (tow.c ? { x: tow.c.planet.x, y: tow.c.planet.y, vx: 0, vy: 0, angle: 0, ground: (tow.c.planet.base || tow.c.planet).id, theta: tow.c.planet.st.nodes[0].a, fuel: tow.fuel }
      : { x: world.spawn.x, y: world.spawn.y, vx: 0, vy: 0, angle: -Math.PI / 2, ground: null, theta: 0, fuel: tow.fuel })
    : { x: player.x, y: player.y, vx: player.vx, vy: player.vy, angle: player.angle, ground: player.ground ? player.ground.base.id : null, theta: player.theta, fuel: player.fuel };
  return {
    v: SAVE_VERSION, gen: world.gen, seed: world.seed, world: world.serialize(), eco: eco.serialize(), tut: tutorial.serialize(),
    ...pl,
    // 菜单里显示的概要
    meta: { savedAt: Date.now(), playTime: eco.time, colonies: eco.colonies.size, pop: Math.floor(t.pop), bloomed: world.bloomedCount, won: eco.won },
  };
}

// 自动保存 / 手动保存：只在有存档槽、而且这一局已经开始（不是标题画面）时写入
function writeSave() {
  if (!slot || state === 'title' || !world) return false;
  return writeSlot(slot, snapshot());
}

function restorePlayer(s) {
  if (s.ground) {
    const b = world.findById(s.ground);
    if (b) { player.standOn(world.nearest(b, s.x, s.y), s.theta); player.fuel = s.fuel; cam.snap(player.x, player.y); player.interpolate(1); return; }
  }
  if (typeof s.x === 'number' && isFinite(s.x)) {
    player.x = s.x; player.y = s.y; player.vx = s.vx || 0; player.vy = s.vy || 0;
    player.angle = s.angle || -Math.PI / 2; player.fuel = s.fuel == null ? 70 : s.fuel;
    player.savePrev(); player.interpolate(1);
    cam.snap(player.x, player.y);
  } else goHome();
}

setInterval(writeSave, 4000);
addEventListener('beforeunload', writeSave);

// ---------- 发现 ----------
const nearList = [];
function checkDiscovery() {
  for (const b of world.bodiesNear(player.x, player.y, 3200, nearList)) {
    const id = b.base.id;
    if (world.discovered.has(id)) continue;
    const d = Math.hypot(b.x - player.x, b.y - player.y) - b.R;
    const range = b.kind === 'star' ? 2600 : Math.max(650, fieldOf(b) * 1.8);
    if (d < range) {
      world.discovered.add(id);
      let sub;
      if (b.kind === 'star') sub = `发现恒星 · ${b.typeZh}`;
      else {
        const alive = b.st.harv.filter((h) => h.alive).length;
        sub = `发现${b.st.bloom ? '' : '枯萎的'}${b.typeZh} · ${sizeLabel(b.R)}` + (alive ? ` · ${alive} 只收割者` : '');
      }
      hud.toast(b.name, sub, b.kind === 'star' ? '#ffd28a' : b.uiColor);
      audio.discover();
    }
  }
}

// 当前情境下最有用的一句提示
function contextHint() {
  if (colonyPanel.isOpen || state !== 'play' || !S.hints) return null;
  // 新手引导的目标清单显示时，和清单重复的「下一步做什么」不再显示（危险提示照常）
  const guide = (text) => (tutorial.listVisible ? null : text);
  if (tow) return null;
  // v0.9.6 低功率：优先显示
  if (player.lowPower) {
    const gc = player.ground && player.ground.st ? player.ground.st.colony : null;
    if (gc && !gc.fallen) return `低功率：在这里${touch.enabled ? '按住「充能」' : '按住 R'}给飞船充能`;
    return '低功率：速度减半、小炮停火。再被无人机缠上就会失能——回殖民地补能，或者去找能量石、靠近恒星' + (cam.W > 760 ? '。卡住了可以在菜单里选「回到最近的殖民地」' : '');
  }
  if (garden.drains.length) return sprites.list.length ? '红色敌人在吸取能量！精灵正在攻击它们' : '红色敌人在吸取能量！飞船的小炮打不过无人机：在殖民地建精灵巢孵化精灵，再带上它们';
  if (garden.charging) return '正在给种子节点充能…';
  if (garden.scanning) return `正在扫描「${garden.scanning.p.name.split(' ')[0]}」… ${Math.floor(garden.scanning.prog * 100)}%`;
  if (player.fuel < 15 && !T.infiniteFuel) return `能量不足：吸收绿色结晶、靠近恒星，或停在自己的殖民地${touch.enabled ? '按住「充能」' : '按住 R'}充能`;
  const g = player.ground;
  // v0.10：装着殖民舱降落时，殖民提示里加上丰度（没扫过写「未扫描」）
  const richTip = (b) => (b.st.scanned && b.survey ? `（${richLabel(b, b.survey.rich)}${b.survey.find ? ` · ${FINDS[b.survey.find].zh}` : ''}）` : '（未扫描）');
  if (!eco.colonies.size) {
    if (g && g.st && g.st.bloom && !g.st.harv.some((h) => h.alive) && eco.ship.pod) return guide(`按 E 用殖民舱在「${g.name}」建立第一个殖民地${richTip(g)}`);
    if (!g) return guide('飞近一颗新手星球，给表面的种子充能把它唤醒，然后降落建立第一个殖民地');
  }
  if (g && g.st && g.st.bloom) {
    if (g.st.colony) return !g.st.colony.fallen && player.fuel < eco.fuelMax - 0.5 ? (touch.enabled ? `点 E 管理殖民地「${g.name.split(' ')[0]}」 · 按住 ⚡ 充能` : `按 E 管理殖民地「${g.name}」 · 按住 R 充能`) : `按 E 管理殖民地「${g.name}」`;
    if (!g.st.harv.some((h) => h.alive)) return eco.ship.pod ? `按 E 用殖民舱在这里建立殖民地${richTip(g)}` : guide('这里可以殖民：先到任意殖民地的「搬运」页装配殖民舱');
  }
  const b = player.ground || player.fieldBody;
  if (b && b.kind === 'planet' && !sprites.list.length && b.st.harv.some((h) => h.alive) && !(b.st.colony && b.st.colony.fallen)) return guide('这里有收割者：靠近它们，飞船的小炮会自动开火（离太近会被吸能量）');
  if (b && b.kind === 'planet' && b.st.colony && b.st.colony.fallen) {
    const alive = b.st.harv.filter((h) => h.alive).length;
    const left = b.st.nodes.filter((n) => n.fill < 1).length;
    return alive ? `收复「${b.name}」：先让精灵消灭 ${alive} 只收割者` : `收复「${b.name}」：给种子充能（还剩 ${left} 个）`;
  }
  if (b && b.kind === 'planet' && !b.st.bloom) {
    const left = b.st.nodes.filter((n) => n.fill < 1).length;
    return guide(`飞近星球表面的灰色种子给它充能（还剩 ${left} 个），全部充满即可唤醒星球`);
  }
  return null;
}

// ---------- v0.11.4 按住充能 ----------
// 键盘 R、手柄 LB、面板按钮、触屏「充能」任一按住就充；松开就停。
// 起飞、满了、殖民地没电、失守、暂停 / 菜单、切到后台都会中止这一次按住（要松开再按才重新开始）
const charge = { panel: false, stopped: false, active: false, fx: 0 };
function chargeColony() { const g = player.ground; return g && g.st ? g.st.colony : null; }
function chargeHeld() { return Input.isDown('KeyR') || Input.padDown(4) || charge.panel || touch.charge; }
function stopCharge() { charge.stopped = true; charge.active = false; hud.charging = false; }
function updateCharge(dt) {
  if (!chargeHeld()) { charge.stopped = false; charge.active = false; return; }
  if (charge.stopped) return;
  if (state !== 'play' || tow || menu.isOpen) { stopCharge(); return; }
  const c = chargeColony();
  const why = eco.chargeBlock(c, player, false);
  if (why) {
    // 刚按下就不能充：说明原因；充着充着停了：满了 / 殖民地充光了才说
    if (!charge.active || /已满|没有能量/.test(why)) hud.flash(why === '殖民地没有能量了' ? `${c.planet.name.split(' ')[0]} 的能量充光了` : why);
    stopCharge(); return;
  }
  const n = eco.chargeShip(c, player, dt);
  charge.active = n > 0;
  if (!charge.active) return;
  // 反馈：能量从星球表面流向飞船
  charge.fx += dt;
  const g = player.ground;
  while (charge.fx > 0.03) {
    charge.fx -= 0.03;
    const a = player.theta + (Math.random() - 0.5) * 0.5, r0 = g.R * (0.55 + Math.random() * 0.3);
    const x = g.x + Math.cos(a) * r0, y = g.y + Math.sin(a) * r0;
    const life = 0.45 + Math.random() * 0.2;
    particles.spawn({ x, y, vx: (player.x - x) / life, vy: (player.y - y) / life, life, size: 2 + Math.random() * 2, c1: '255,179,71', c2: '255,240,200' });
  }
}
